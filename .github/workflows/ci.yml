# CI for DecisionGuideAI — runs on pushes and pull requests to main.
# It creates two required checks: "TypeScript" and "Tests".
# Safe dummy env vars are provided so no real secrets are needed in CI.
#
# Optimisation notes (2026-02):
# - Shared `install` job caches node_modules for all downstream jobs
# - vitest + coverage merged into a single job (was running tests twice)
# - build artifact shared with bundle-policy (was building twice)
# - E2E Chromium sharded across 4 runners (was single-threaded, 90+ specs)
# - Removed duplicate e2e.yml and compose-evidence.yml workflows

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

# Cancel older runs of the same branch/PR to save time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Safe defaults so builds/tests do not need real keys.
env:
  TZ: UTC
  CI: "1"
  VITE_OPENAI_API_KEY: "test"
  VITE_SUPABASE_URL: "http://localhost"
  VITE_SUPABASE_ANON_KEY: "test"
  VITE_FEATURE_SSE: "0"
  VITE_EDGE_GATEWAY_URL: "http://localhost:3001"
  VITE_PLOT_LITE_BASE_URL: "/plot-lite"

jobs:
  # ── Shared install: cache node_modules for all downstream jobs ──
  install:
    name: Install & Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

  # ── Security (no install dependency — runs independently) ──────────────
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  security-audit:
    name: Security Audit (pnpm)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Audit for high/critical vulnerabilities
        # pnpm audit --prod --audit-level high — fails the job on any prod-tree
        # high/critical advisory. Moderate/low are surfaced but do not block.
        run: pnpm run security:audit

  # ── Static analysis ────────────────────────────────────────────────────
  tsc:
    name: TypeScript
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}


      # ── ROADMAP 2.649 — parity with staging-full-tests.yml ──────────────────
      # Placed BEFORE the "Schema contract gate" step below: these two verify
      # the vendored tarball's BYTES (sha256 sidecar via
      # scripts/check-vendor-sha.mjs) and the derived version constant, while
      # the gate asserts the pin's SHAPE. (ROADMAP 2.662 rewrote the gate to
      # permit the vendored pin — the registry-semver assertion it replaced
      # could never pass at a vendored tip, and demonstrably failed at
      # 9907cebd, run 26251187065.)
      - name: Vendored schemas tarball integrity
        run: pnpm run check:vendor

      - name: Vendored schemas version constant is derived, not drifted
        run: pnpm run ci:guard:schemas-version

      # ── POLICY (ROADMAP 2.662, ruled 6 Aug 2026): the vendored tarball IS the
      # contract mechanism — a sha256-asserted `npm pack` from the schemas repo,
      # pinned as `file:./vendor/talchain-schemas-<semver>.tgz`; registry pins
      # are NOT permitted (the registry envelope differs from the canonical
      # npm-pack bytes — see vendor/README.md). This gate permits EXACTLY that
      # shape and forbids every other `file:` reference. Byte integrity of the
      # tarball against its .sha256 sidecar is `check:vendor`'s job (run above)
      # and is deliberately not duplicated here.
      - name: Schema contract gate
        run: |
          set -euo pipefail
          echo "Checking schema dependency contract..."

          ALLOWED_PIN_RE='"@talchain/schemas": "file:\./vendor/talchain-schemas-[0-9]+\.[0-9]+\.[0-9]+\.tgz"'

          # 1. The ONLY file: reference permitted anywhere in package.json is
          #    the vendored @talchain/schemas pin (exact anchored shape above).
          #    Both conditions reported separately: (1a) how many references
          #    match the permitted shape, (1b) every reference that does not.
          FILE_REFS="$(grep -an '"file:' package.json || true)"
          if [ -n "$FILE_REFS" ]; then
            ALLOWED_COUNT="$(printf '%s\n' "$FILE_REFS" | grep -acE "$ALLOWED_PIN_RE" || true)"
            OTHER_REFS="$(printf '%s\n' "$FILE_REFS" | grep -avE "$ALLOWED_PIN_RE" || true)"
          else
            ALLOWED_COUNT=0
            OTHER_REFS=""
          fi
          echo "OK (1a): file: references matching the vendored @talchain/schemas pin shape: $ALLOWED_COUNT"
          if [ -n "$OTHER_REFS" ]; then
            echo "FAIL (1b): package.json carries file: reference(s) other than the vendored @talchain/schemas pin:"
            printf '%s\n' "$OTHER_REFS"
            exit 1
          fi
          echo "OK (1b): no other file: references in package.json"

          # 2. No local fork directory
          if [ -d "packages/olumi-schemas" ]; then
            echo "FAIL: packages/olumi-schemas/ fork directory exists"
            exit 1
          fi

          # 3. @talchain/schemas must be the vendored-tarball pin (NOT a
          #    registry semver), and the tarball the pin names must be tracked
          #    in the tree at the exact semver the pin states.
          SCHEMA_DEP="$(node -p "require('./package.json').dependencies['@talchain/schemas']")"
          if printf '%s\n' "$SCHEMA_DEP" | grep -aqE '^file:\./vendor/talchain-schemas-[0-9]+\.[0-9]+\.[0-9]+\.tgz$'; then
            echo "OK (3a): @talchain/schemas = $SCHEMA_DEP (vendored tarball pin — the contract mechanism)"
          else
            echo "FAIL (3a): @talchain/schemas = $SCHEMA_DEP"
            echo "  Policy: the vendored tarball IS the contract mechanism. The pin must be"
            echo "  exactly file:./vendor/talchain-schemas-<semver>.tgz. Registry semver"
            echo "  pins are NOT permitted — the registry envelope differs from the"
            echo "  canonical npm-pack bytes (see vendor/README.md)."
            exit 1
          fi
          # Internal consistency: extract the pin's semver, rebuild the
          # filename from it, and assert THAT path is tracked (git ls-files is
          # NUL-safe where a filesystem grep is not). Deeper tarball integrity
          # (sha256 sidecar) is check:vendor's job — not duplicated here.
          PIN_SEMVER="$(printf '%s\n' "$SCHEMA_DEP" | sed -E 's|^file:\./vendor/talchain-schemas-([0-9]+\.[0-9]+\.[0-9]+)\.tgz$|\1|')"
          PIN_TARBALL="vendor/talchain-schemas-${PIN_SEMVER}.tgz"
          if git ls-files --error-unmatch -- "$PIN_TARBALL" >/dev/null 2>&1; then
            echo "OK (3b): pinned tarball $PIN_TARBALL (semver $PIN_SEMVER) is tracked in the tree"
          else
            echo "FAIL (3b): the pin names $PIN_TARBALL but that file is not tracked in the tree"
            exit 1
          fi

          # 4. No source imports from local schema paths
          if grep -rn "from.*packages/olumi-schemas" src/ --include='*.ts' --include='*.tsx'; then
            echo "FAIL: Source files import from local fork path"
            exit 1
          fi

          echo "All schema contract checks passed."

      - name: Lint
        run: pnpm run lint

      - name: Check for legacy Olumi tokens
        run: |
          echo "🔍 Checking for legacy --olumi-* tokens..."

          # Check for legacy --olumi-* tokens (strict check - these should all be migrated)
          if grep -r -n 'var(--olumi-' src/ \
            --include="*.tsx" --include="*.ts" --include="*.css" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=poc \
            --exclude-dir=plc; then
            echo "❌ Found legacy --olumi-* tokens in src/. These must be migrated to Olumi v1.2 tokens."
            echo "   See docs/LEGACY_TOKEN_MIGRATION.md for migration guide."
            exit 1
          fi

          echo "✅ No legacy --olumi-* tokens found."
          echo ""
          echo "ℹ️  Note: Hard-coded color enforcement is handled by ESLint (pnpm run lint)."
          echo "   The ESLint rule 'brand-tokens/no-raw-colors' checks for hard-coded hex/rgb/hsl colors."

      - name: Type check (no emit)
        run: pnpm run typecheck

      - name: React 185 guard (Zustand selectors)
        run: pnpm run ci:guard:zustand

      - name: Duplicate-suffix guard
        run: pnpm run ci:guard:duplicates

      # Design System v5 drift ratchet — REPORT-ONLY soak (Stage 2a). Surfaces
      # net-new legacy tokens / raw hex / all-caps / panel-typography vs the
      # committed baseline; DS debt does NOT fail CI, but a missing/corrupt baseline
      # DOES (guard misconfiguration). Promote DS-debt detection to ci:guard:ds:enforce
      # in a follow-up once the baseline has soaked.
      - name: Design System v5 drift (report-only soak)
        run: pnpm run ci:guard:ds

  # ── Typecheck gate self-test (positive control) ──────────────────────
  # PARITY WITH staging-full-tests.yml. The `tsc` job above asserts an ABSENCE
  # ("no new type errors, no invisible files"). That assertion is worth nothing
  # unless the gate can be shown to detect a PRESENCE — the gate it replaced was
  # green for months while loading 9% of src, and nobody had ever watched it go
  # red. #470 wired this self-test into the Staging Gate but not into ci.yml, so
  # the `TypeScript` check required on `main` was running an unproven gate.
  # Its own job so it runs in parallel and costs no serial time.
  typecheck-selftest:
    name: Typecheck Gate Self-Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The self-test derives the source set with `git ls-files`, so it needs a
      # real checkout (actions/checkout gives one) and a clean working tree.
      - name: Prove the typecheck gate actually bites
        run: pnpm run typecheck:selftest

  # ── Unit tests + coverage (merged — was two separate jobs running tests twice) ──
  vitest:
    name: Tests + Coverage
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}


      - name: Run unit tests with coverage
        run: pnpm run test:coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Ensure tests.json (non-blocking)
        run: node tools/ensure-tests-json.js
        env:
          ENSURE_TESTS_JSON_SKIP_RUN: '1'
        continue-on-error: true

  # ── Backend contract ───────────────────────────────────────────────────
  contract:
    name: Backend Contract
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Verify backend contract
        run: pnpm run ci:verify-contract
        env:
          VITE_PLOT_LITE_BASE_URL: https://plot-lite-service.onrender.com
        continue-on-error: false

  # ── Build + dist scans + bundle policy (merged — was two jobs building twice) ──
  build:
    name: Build + No-Console + Bundle Policy
    needs: install
    runs-on: ubuntu-latest
    # POC: Skip on PoC branches to avoid console/E2E scan failures
    if: ${{ !contains(github.ref_name, 'hotfix/poc') && !contains(github.ref_name, 'poc') && !contains(github.ref_name, 'safe/poc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}


      - name: Build (with PLC assertion + bundle budget)
        run: pnpm run build:ci

      - name: Scan dist for console/debugger and E2E toggles
        run: |
          pnpm run ci:no-console
          pnpm run ci:scan-dist

      - name: Bundle Policy (safe chunks React-free)
        run: pnpm run ci:bundle-policy

      # Reds if the built bundle bakes a VITE_* variable that no source file
      # reads (the signature of a wholesale `import.meta.env` inline), or one
      # that is not in the declared allow-list. Deliberately NOT part of
      # `build:ci`: that is what Netlify runs, and a false red there would break
      # staging deploys for every lane. This gates the MERGE, not the DEPLOY.
      - name: Bundle env allow-list (no unread VITE_* baked into the bundle)
        run: pnpm run ci:guard:bundle-env

      # Reds if src/lib/flagEnv.ts has fallen behind src/flags.ts — a missing
      # key would make that flag silently resolve to its defaultValue.
      - name: flagEnv freshness (derived from src/flags.ts + netlify.toml)
        run: pnpm run ci:guard:flag-env

  # ── E2E Chromium (sharded across 4 runners) ───────────────────────────
  e2e-chromium:
    name: E2E Chromium (${{ matrix.shard }})
    needs: install
    runs-on: ubuntu-latest
    # POC: Skip on PoC branches to avoid E2E failures
    if: ${{ !contains(github.ref_name, 'hotfix/poc') && !contains(github.ref_name, 'poc') && !contains(github.ref_name, 'safe/poc') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (Chromium, shard ${{ matrix.shard }})
        run: pnpm exec playwright test --project=chromium -c playwright.config.ts --retries=1 --shard=${{ matrix.shard }}

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E cross-browser smoke ────────────────────────────────────────────
  e2e-firefox:
    name: E2E Smoke (Firefox)
    needs: install
    runs-on: ubuntu-latest
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Firefox (Playwright)
        run: pnpm exec playwright install --with-deps firefox
      - name: Run smoke + summary-v2 on Firefox
        run: >-
          pnpm exec playwright test
          e2e/flags-off.smoke.spec.ts
          e2e/summary-v2.spec.ts
          --project=firefox -c playwright.config.ts

  e2e-webkit:
    name: E2E Smoke (WebKit)
    needs: install
    runs-on: ubuntu-latest
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install WebKit (Playwright)
        run: pnpm exec playwright install --with-deps webkit
      - name: Run smoke + summary-v2 on WebKit
        run: >-
          pnpm exec playwright test
          e2e/flags-off.smoke.spec.ts
          e2e/summary-v2.spec.ts
          --project=webkit -c playwright.config.ts

  # ── Evidence ───────────────────────────────────────────────────────────
  evidence:
    name: Evidence (Perf, A11y, UI-Pack, Share-Cap, Immutability)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium
      - name: Perf probe (worker layout, p95)
        run: pnpm exec playwright test e2e/perf-worker-20-nodes.spec.ts --project=chromium -c playwright.config.ts
      - name: Vendored a11y (axe)
        run: pnpm run evidence:a11y
      - name: UI evidence pack
        run: pnpm run evidence:ui-pack
      - name: Share-link cap evidence
        run: pnpm run evidence:share-cap
      - name: Immutability unit test (report.json hash)
        run: pnpm run test -- src/lib/__tests__/evidence.immutability.test.ts
      - name: Upload evidence artefacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts
          path: |
            docs/evidence/**
          if-no-files-found: warn

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-evidence
          path: |
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E production safe-screen ─────────────────────────────────────────
  e2e-prod-safe:
    name: E2E (production safe-screen)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (production)
        run: pnpm run build:prod

      - name: E2E (production safe-screen)
        run: pnpm run e2e:prod-safe

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-safe-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
