# CI for DecisionGuideAI — runs on pushes and pull requests to main.
# It creates two required checks: "TypeScript" and "Tests".
# Safe dummy env vars are provided so no real secrets are needed in CI.
#
# Optimisation notes (2026-02):
# - Shared `install` job caches node_modules for all downstream jobs
# - vitest + coverage merged into a single job (was running tests twice)
# - build artifact shared with bundle-policy (was building twice)
# - E2E Chromium sharded across 4 runners (was single-threaded, 90+ specs)
# - Removed duplicate e2e.yml and compose-evidence.yml workflows

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

# Cancel older runs of the same branch/PR to save time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Safe defaults so builds/tests do not need real keys.
env:
  TZ: UTC
  CI: "1"
  VITE_OPENAI_API_KEY: "test"
  VITE_SUPABASE_URL: "http://localhost"
  VITE_SUPABASE_ANON_KEY: "test"
  VITE_FEATURE_SSE: "0"
  VITE_EDGE_GATEWAY_URL: "http://localhost:3001"
  VITE_PLOT_LITE_BASE_URL: "/plot-lite"

jobs:
  # ── Shared install: cache node_modules for all downstream jobs ──
  install:
    name: Install & Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          cache: "npm"

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

  # ── Security (no install dependency — runs independently) ──────────────
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  security-audit:
    name: Security Audit (npm)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Audit for high/critical vulnerabilities
        run: npm run security:audit

  # ── Static analysis ────────────────────────────────────────────────────
  tsc:
    name: TypeScript
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}


      - name: Schema contract gate
        run: |
          echo "Checking schema dependency contract..."

          # 1. No file: references for @talchain/schemas
          if grep -q '"file:' package.json; then
            echo "FAIL: package.json contains file: dependency links"
            grep '"file:' package.json
            exit 1
          fi

          # 2. No local fork directory
          if [ -d "packages/olumi-schemas" ]; then
            echo "FAIL: packages/olumi-schemas/ fork directory exists"
            exit 1
          fi

          # 3. @talchain/schemas must be a semver version (not a path)
          SCHEMA_VER=$(node -p "require('./package.json').dependencies['@talchain/schemas']")
          if echo "$SCHEMA_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "OK: @talchain/schemas = $SCHEMA_VER (registry version)"
          else
            echo "FAIL: @talchain/schemas = $SCHEMA_VER (not a registry version)"
            exit 1
          fi

          # 4. No source imports from local schema paths
          if grep -rn "from.*packages/olumi-schemas" src/ --include='*.ts' --include='*.tsx'; then
            echo "FAIL: Source files import from local fork path"
            exit 1
          fi

          echo "All schema contract checks passed."

      - name: Lint
        run: npm run lint

      - name: Check for legacy Olumi tokens
        run: |
          echo "🔍 Checking for legacy --olumi-* tokens..."

          # Check for legacy --olumi-* tokens (strict check - these should all be migrated)
          if grep -r -n 'var(--olumi-' src/ \
            --include="*.tsx" --include="*.ts" --include="*.css" \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=poc \
            --exclude-dir=plc; then
            echo "❌ Found legacy --olumi-* tokens in src/. These must be migrated to Olumi v1.2 tokens."
            echo "   See docs/LEGACY_TOKEN_MIGRATION.md for migration guide."
            exit 1
          fi

          echo "✅ No legacy --olumi-* tokens found."
          echo ""
          echo "ℹ️  Note: Hard-coded color enforcement is handled by ESLint (npm run lint)."
          echo "   The ESLint rule 'brand-tokens/no-raw-colors' checks for hard-coded hex/rgb/hsl colors."

      - name: Type check (no emit)
        run: npm run typecheck

      - name: React 185 guard (Zustand selectors)
        run: npm run ci:guard:zustand

      - name: Duplicate-suffix guard
        run: npm run ci:guard:duplicates

  # ── Unit tests + coverage (merged — was two separate jobs running tests twice) ──
  vitest:
    name: Tests + Coverage
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}


      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Ensure tests.json (non-blocking)
        run: node tools/ensure-tests-json.js
        env:
          ENSURE_TESTS_JSON_SKIP_RUN: '1'
        continue-on-error: true

  # ── Backend contract ───────────────────────────────────────────────────
  contract:
    name: Backend Contract
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Verify backend contract
        run: npm run ci:verify-contract
        env:
          VITE_PLOT_LITE_BASE_URL: https://plot-lite-service.onrender.com
        continue-on-error: false

  # ── Build + dist scans + bundle policy (merged — was two jobs building twice) ──
  build:
    name: Build + No-Console + Bundle Policy
    needs: install
    runs-on: ubuntu-latest
    # POC: Skip on PoC branches to avoid console/E2E scan failures
    if: ${{ !contains(github.ref_name, 'hotfix/poc') && !contains(github.ref_name, 'poc') && !contains(github.ref_name, 'safe/poc') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}


      - name: Build (with PLC assertion + bundle budget)
        run: npm run build:ci

      - name: Scan dist for console/debugger and E2E toggles
        run: |
          npm run ci:no-console
          npm run ci:scan-dist

      - name: Bundle Policy (safe chunks React-free)
        run: npm run ci:bundle-policy

  # ── E2E Chromium (sharded across 4 runners) ───────────────────────────
  e2e-chromium:
    name: E2E Chromium (${{ matrix.shard }})
    needs: install
    runs-on: ubuntu-latest
    # POC: Skip on PoC branches to avoid E2E failures
    if: ${{ !contains(github.ref_name, 'hotfix/poc') && !contains(github.ref_name, 'poc') && !contains(github.ref_name, 'safe/poc') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Chromium, shard ${{ matrix.shard }})
        run: npx playwright test --project=chromium -c playwright.config.ts --retries=1 --shard=${{ matrix.shard }}

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ strategy.job-index }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E cross-browser smoke ────────────────────────────────────────────
  e2e-firefox:
    name: E2E Smoke (Firefox)
    needs: install
    runs-on: ubuntu-latest
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Firefox (Playwright)
        run: npx playwright install --with-deps firefox
      - name: Run smoke + summary-v2 on Firefox
        run: >-
          npx playwright test
          e2e/flags-off.smoke.spec.ts
          e2e/summary-v2.spec.ts
          --project=firefox -c playwright.config.ts

  e2e-webkit:
    name: E2E Smoke (WebKit)
    needs: install
    runs-on: ubuntu-latest
    env:
      VITE_E2E: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install WebKit (Playwright)
        run: npx playwright install --with-deps webkit
      - name: Run smoke + summary-v2 on WebKit
        run: >-
          npx playwright test
          e2e/flags-off.smoke.spec.ts
          e2e/summary-v2.spec.ts
          --project=webkit -c playwright.config.ts

  # ── Evidence ───────────────────────────────────────────────────────────
  evidence:
    name: Evidence (Perf, A11y, UI-Pack, Share-Cap, Immutability)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Perf probe (worker layout, p95)
        run: npx playwright test e2e/perf-worker-20-nodes.spec.ts --project=chromium -c playwright.config.ts
      - name: Vendored a11y (axe)
        run: npm run evidence:a11y
      - name: UI evidence pack
        run: npm run evidence:ui-pack
      - name: Share-link cap evidence
        run: npm run evidence:share-cap
      - name: Immutability unit test (report.json hash)
        run: npm run test -- src/lib/__tests__/evidence.immutability.test.ts
      - name: Upload evidence artefacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts
          path: |
            docs/evidence/**
          if-no-files-found: warn

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-evidence
          path: |
            playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # ── E2E production safe-screen ─────────────────────────────────────────
  e2e-prod-safe:
    name: E2E (production safe-screen)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npm run build:prod

      - name: E2E (production safe-screen)
        run: npm run e2e:prod-safe

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-safe-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
