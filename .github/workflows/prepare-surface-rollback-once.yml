name: Prepare neutral-surface candidate (isolated)

on:
  push:
    branches: [maintenance/prepare-surface-rollback-20261006]
    paths: [.github/workflows/prepare-surface-rollback-once.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Talchain/DecisionGuideAI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the existing PR head, without this maintenance workflow
        uses: actions/checkout@v4
        with:
          ref: 2dfe5f8734e9c335d971ec239862e2c8a140bd84
          fetch-depth: 1
      - name: Apply only the approved palette signature and stale surface fallbacks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2dfe5f8734e9c335d971ec239862e2c8a140bd84"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import copy
          import json
          import pathlib
          import re
          import subprocess

          path = pathlib.Path('tools/ci-guards/ds-compliance-baseline.json')
          expected_blob = '4b32fb3fe7c418a21a7ea104ccff270f270ab641'
          actual_blob = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + str(path)], text=True).strip()
          assert actual_blob == expected_blob, 'Baseline changed: inspect before retrying'
          old = path.read_text()
          before = json.loads(old)
          signatures = before['classes']['production-hex']['signatures']
          prefix = 'production-hex :: src/components/chat/artefactIframeTemplate.ts :: '
          previous = prefix + '#FCF7F1'
          restored = prefix + '#FEFEFE'
          assert signatures[previous] == {
              'count': 1,
              'file': 'src/components/chat/artefactIframeTemplate.ts',
              'token': '#FCF7F1',
              'sample': '--bg-panel-hover: #FCF7F1;',
          }
          assert restored not in signatures
          expected = copy.deepcopy(before)
          target = expected['classes']['production-hex']['signatures']
          entry = target.pop(previous)
          entry['token'] = '#FEFEFE'
          entry['sample'] = '--bg-panel: #FEFEFE;'
          target[restored] = entry
          assert target[prefix + '#FEF9F3']['sample'] == '--bg-panel: #FEF9F3;'
          target[prefix + '#FEF9F3']['sample'] = '--bg-panel-hover: #FEF9F3;'

          # Preserve formatting and every unrelated byte; never regenerate the baseline.
          substitutions = [
              ('"' + previous + '"', '"' + restored + '"'),
              ('"token": "#FCF7F1"', '"token": "#FEFEFE"'),
              ('"sample": "--bg-panel-hover: #FCF7F1;"', '"sample": "--bg-panel: #FEFEFE;"'),
              ('"sample": "--bg-panel: #FEF9F3;"', '"sample": "--bg-panel-hover: #FEF9F3;"'),
          ]
          new = old
          for source, replacement in substitutions:
              assert new.count(source) == 1, 'Expected one exact baseline field: ' + source
              new = new.replace(source, replacement, 1)
          assert json.loads(new) == expected, 'Unexpected baseline change'
          assert len(old.splitlines()) == len(new.splitlines())
          assert sum(a != b for a, b in zip(old.splitlines(), new.splitlines())) == 4
          path.write_text(new)

          # A fallback must agree with the canonical token. These two tokens now resolve
          # to near-white. Do not touch any other colour, CSS property or interaction.
          pattern = re.compile(r'(var\(\s*--(?:bg-panel|surface-card)\s*,\s*)#FEF9F3(\s*\))')
          edits = []
          for source_path in sorted(pathlib.Path('src').rglob('*')):
              if not source_path.is_file() or source_path.suffix not in {'.ts', '.tsx', '.css'}:
                  continue
              if any(part in {'__tests__', '__fixtures__', 'node_modules'} for part in source_path.parts):
                  continue
              if '.spec.' in source_path.name or '.test.' in source_path.name:
                  continue
              original = source_path.read_text()
              updated, count = pattern.subn(lambda match: match[1] + '#FEFEFE' + match[2], original)
              if count:
                  edits.append((source_path, original, updated, count))
          assert len(edits) <= 20 and sum(row[3] for row in edits) <= 100, 'Unexpectedly broad fallback change'
          for source_path, original, updated, count in edits:
              assert updated.replace('#FEFEFE', '#FEF9F3') == original.replace('#FEFEFE', '#FEF9F3')
              source_path.write_text(updated)
              print('SURFACE_FALLBACK', str(source_path), count)
          print('BASELINE: exactly four lines; allowance counts and all unrelated fields unchanged')
          print('FALLBACKS:', sum(row[3] for row in edits), 'in', len(edits), 'files')
          PY
          git diff --check
          git diff --stat
          test -z "$(git diff --name-only -- .github package.json pnpm-lock.yaml src/styles/brand.css)"
          test ! -e .github/workflows/prepare-surface-rollback-once.yml
      - name: Publish a candidate branch only, never staging or main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/ci-guards/ds-compliance-baseline.json src
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(design): align restored surface fallbacks and the exact iframe palette signature'
          git push origin HEAD:refs/heads/fix/surface-rollback-consistency-20261006
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "PARENT_SHA=$(git rev-parse HEAD^)"
          echo 'Candidate only. Existing protected PR checks must pass before the authorised staging merge.'
