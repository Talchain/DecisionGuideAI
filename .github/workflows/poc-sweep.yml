name: PoC UI Sweep

on:
  push:
    branches: [ feat/release-readiness ]
  workflow_dispatch:

concurrency:
  group: poc-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install deps
        env:
          NPM_CONFIG_ENGINE_STRICT: 'false'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify lockfile unchanged
        run: |
          git diff --exit-code -- pnpm-lock.yaml

      - name: Capture install debug (on fail)
        if: failure()
        run: |
          echo "## Install failure context" >> $GITHUB_STEP_SUMMARY

      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (temporary JS-only)
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Console-free
        run: pnpm run ci:no-console

      - name: Bundle budget (gzipped)
        run: |
          mkdir -p docs/evidence/bundle
          node scripts/ci/scan-dist.mjs | tee docs/evidence/bundle/bundle_report.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox webkit

      - name: Unit tests
        env:
          TZ: UTC
          LANG: en_GB.UTF-8
          LC_ALL: en_GB.UTF-8
        run: pnpm run test:unit

      - name: E2E Chromium (full)
        run: pnpm run test:e2e:chromium -- --grep-invert @flaky --retries=2

      - name: E2E Firefox smoke
        run: pnpm run test:e2e:firefox  -- e2e/flags-off.smoke.spec.ts

      - name: E2E WebKit smoke
        run: pnpm run test:e2e:webkit   -- e2e/flags-off.smoke.spec.ts

      - name: "Evidence: a11y"
        run: pnpm run evidence:a11y
      - name: "Evidence: UI pack"
        run: pnpm run evidence:ui-pack
      - name: "Evidence: share-cap"
        run: pnpm run evidence:share-cap
      - name: "Evidence: immutability"
        run: pnpm run test -- src/lib/__tests__/evidence.immutability.test.ts

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-ui-evidence
          path: |
            docs/evidence/**
            playwright-report/**
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "### PoC UI Sweep ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Typecheck/Lint/Build/Console-free ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Unit ✅  | E2E: Chromium ✅  FF ✅  WK ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Evidence uploaded as artifacts" >> $GITHUB_STEP_SUMMARY
