# Full test suite for staging pushes and PRs into staging.
#
# The local pre-push hook (scripts/validate-prepush.sh) runs only fast checks
# (typecheck, lint on changed files, smoke tests). This workflow runs the
# complete 6,900+ test suite on every push to staging and every PR targeting
# staging, so regressions are caught before any merge to main.
#
# Sharding (ROADMAP 1.26, chronic-CI-red fix): the vitest job runs as a
# 4-way matrix (`--shard=N/4`), each shard on its own runner. This is
# defence-in-depth against a single job's memory/wall-clock ceiling — the
# chronic red's proximate cause was actually a genuine infinite-render-loop
# hang in one spec (tests/canvas/panels/InspectorPanel.test.tsx, root-caused
# + fixed same lane: a test mock recreated a fresh edge object on every
# store read, so the component's "load edge data" effect — keyed on that
# object's identity — re-fired every render and never stabilised), not OOM.
# But a single ~15-20 min unsharded job is a much easier failure mode to
# misdiagnose from outside (hang vs OOM vs genuine failure all look similar
# in a truncated log) than four independent ~2 min shards, and the hang had
# also been masking ~11 genuine, unrelated pre-existing failures (stale
# ratchets/fixtures/mocks, same lane) that only a completed run's summary
# could surface. See docs/ops/vitest-full-suite-oom-diagnosis.md Option C.
#
# Branch protection: configure "Staging Gate" as a required status check on
# main to block merges when any job fails. (Requires repo admin access.)

name: Staging Tests

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]
  # Manual runs, so System E can be pointed at an immutable SHA-pinned deploy URL
  # rather than the mutable staging alias when a verdict has to be attributable.
  workflow_dispatch:
    inputs:
      core_ui_url:
        description: 'Target for the Core E2E suite (default: the staging alias)'
        required: false
        default: 'https://staging--olumi.netlify.app'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  CI: "1"
  VITE_OPENAI_API_KEY: "test"
  VITE_SUPABASE_URL: "http://localhost"
  VITE_SUPABASE_ANON_KEY: "test"
  VITE_FEATURE_SSE: "0"
  VITE_EDGE_GATEWAY_URL: "http://localhost:3001"
  VITE_PLOT_LITE_BASE_URL: "/plot-lite"
  SHARD_COUNT: 4

jobs:
  # ── Install & cache (shared by all downstream jobs) ──────────────────
  install:
    name: Install & Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── TypeScript + Lint ────────────────────────────────────────────────
  tsc:
    name: TypeScript + Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # Runs the SAME React #185 (Zustand selector) guard as ci.yml's main-only
      # `tsc` job. Without this, the guard first fires at staging→main promotion,
      # i.e. the alarm goes off at the worst possible moment. Enforcing here (it
      # is green) so a regression is caught on the staging path before promotion.
      - name: React 185 guard (Zustand selectors)
        run: pnpm run ci:guard:zustand

      # Starter scenarios are REAL captured CEE drafts. This re-derives the
      # shipped fixtures + manifest from the committed source captures and
      # byte-compares. Without it, the fixtures, the card copy and the redraft
      # brief are three hand-maintainable mirrors that would drift green — the
      # exact defect class CLAUDE.md trap 12 names. Fails the gate on drift.
      - name: Starter fixtures match their source captures
        run: pnpm run ci:guard:starters

      # ── ROADMAP 2.649 — the vendored-pin checklist's INVISIBLE fourth item ──
      # The vendored @talchain/schemas tarball needs a sibling
      # `vendor/<tarball>.tgz.sha256`. Nothing in CI checked for it: `check:vendor`
      # ran only from `dev`/`dev:sandbox` and the local pre-push gate, so a missing
      # or corrupt sidecar passed CI green and first failed at someone's pre-push
      # (the DSK badge car shipped exactly that omission — caught by a lane, not by
      # CI). An alarm that only fires on one developer's machine is not an alarm.
      - name: Vendored schemas tarball integrity
        run: pnpm run check:vendor

      # The version constant stamped into debug/evidence bundles must be DERIVED
      # from the package.json pin, never hand-typed (CLAUDE.md trap 12). This reds
      # if the generated file drifts from the pin.
      - name: Vendored schemas version constant is derived, not drifted
        run: pnpm run ci:guard:schemas-version

      # ── Design System v5 drift ratchet ──────────────────────────────────
      # ⚠ WIRED HERE ON PURPOSE, NOT ONLY IN ci.yml — same reasoning as the
      # bundle-credentials guard in the `build` job below.
      #
      # `staging` protection requires exactly ONE check: "Staging Gate", whose
      # `needs` list is [tsc, typecheck-selftest, vitest, vitest-summary, build].
      # Nothing in ci.yml is required, so the DS guard living only there would
      # advise and never block — which is precisely what happened: it shipped
      # report-only in ci.yml, its false-positive class was diagnosed in the July
      # soak and left unfixed, and from then on NO Design System rule gated
      # anything at all.
      #
      # Derived 2026-08-17:
      #   gh api repos/Talchain/DecisionGuideAI/branches/staging/protection \
      #     --jq '.required_status_checks.contexts'   → ["Staging Gate"]
      # Re-derive before assuming this is still where the blocking happens.
      - name: Design System v5 drift (enforcing)
        run: pnpm run ci:guard:ds:enforce

  # ── Typecheck gate self-test (positive control) ──────────────────────
  # The `tsc` job above asserts an ABSENCE ("no new type errors, no invisible
  # files"). That assertion is worth nothing unless the gate can be shown to
  # detect a PRESENCE — the gate it replaced was green for months while loading
  # 9% of src, and nobody had ever watched it go red. This job deliberately
  # breaks the tree four ways and asserts the gate fails each time (and passes
  # when clean). Its own job so it runs in parallel and costs no serial time.
  typecheck-selftest:
    name: Typecheck Gate Self-Test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The self-test derives the source set with `git ls-files`, so it needs a
      # real checkout (actions/checkout gives one) and a clean working tree.
      - name: Prove the typecheck gate actually bites
        run: pnpm run typecheck:selftest

  # ── Security audit ───────────────────────────────────────────────────
  # Staging is the live PoC — the dependency-audit gate must run where deploys
  # actually happen (the #404 precedent: alarms fire on the staging path, not
  # only at promotion). Mirrors ci.yml's security-audit job.
  security-audit:
    name: Security Audit (pnpm)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Audit for high/critical vulnerabilities
        # pnpm audit --prod --audit-level high — fails on any prod-tree
        # high/critical advisory. Moderate/low surfaced but non-blocking.
        run: pnpm run security:audit

  # ── Flag deployment drift (REPORTING ONLY — never blocks) ─────────────
  # Reads the DEPLOYED staging bundle and prints which feature flags actually
  # resolve ON there, versus what src/flags.ts and netlify.toml claim. Netlify
  # DASHBOARD variables override both and are invisible to this repo, which is
  # why the repo files cannot answer "what does a tester see?" — on 2026-07-28
  # that gap mis-scoped two dispatches, and the check found 13 divergences.
  #
  # ⚠ THIS JOB MUST NEVER BLOCK, and is deliberately absent from the
  # "Staging Gate" aggregator's required-results list at the end of this file.
  # Flipping a dashboard flag is a NORMAL operation; reddening the gate for it
  # would turn this into the broken alarm it exists to replace — a red everyone
  # learns to ignore (trap 7). The script exits 0 on divergences by design, and
  # continue-on-error covers even a crash or a network blip.
  #
  # ⚠ SCOPE: it reports the CURRENTLY-DEPLOYED staging site. On a PR that is the
  # PRE-MERGE state — it is NOT a prediction of what this PR will deploy.
  flag-drift:
    name: Flag Deployment Drift (report only)
    needs: install
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # If staging is unreachable the script reports UNVERIFIED and names every
      # flag it could not check. It never prints a green it has not earned.
      - name: Compare deployed flags against repo config
        run: |
          pnpm run flags:check | tee flag-drift.txt
          {
            echo '### Flag deployment drift — deployed staging vs repo config'
            echo ''
            echo 'The **DEPLOYED** column is the truth. `flags.ts` / `netlify.toml` are advisory:'
            echo 'Netlify dashboard variables override both and this repo cannot see them.'
            echo ''
            echo '```'
            cat flag-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Visual regression (ADVISORY — reports, never blocks) ─────────────
  #
  # WHY: between 2026-08-15 and 2026-08-17 roughly fifteen UI PRs merged, every
  # one green, and together they shipped a layout regression that only the
  # founder's eyes caught. He was the only instrument the programme had for
  # visual defects. This job is the replacement instrument.
  #
  # ⚠ ADVISORY ON PURPOSE, AND ONLY FOR NOW. It is `continue-on-error` and is
  # deliberately ABSENT from the "Staging Gate" aggregator's `needs` at the end
  # of this file, so a red here is loud but does not block a merge. Promoting it
  # to a required check is a separate, later decision, to be taken once its
  # false-positive rate on `ubuntu-latest` has actually been observed rather
  # than assumed. Measured on darwin the run-to-run noise floor is 0 differing
  # pixels out of 1,296,000; the linux figure is not yet known, and gating on an
  # unmeasured false-positive rate is how a check becomes a red everyone learns
  # to ignore (CLAUDE.md trap 7).
  #
  # ⚠ IT MUST NEVER REPORT SUCCESS HAVING EXECUTED NOTHING. A check in this repo
  # did exactly that for 204 days. Two mechanisms prevent it here:
  #   - `globalTeardown` asserts the captured screenshots BY NAME against
  #     STATE_NAMES x VIEWPORTS and fails the run on zero captures;
  #   - references are platform-scoped and a MISSING one is a hard error, not a
  #     silent write (`updateSnapshots: 'none'`), so "no baseline" can never be
  #     mistaken for "no difference".
  #
  # FIRST RUN ON A BRANCH WITH NO LINUX REFERENCES: chromium renders text
  # differently on darwin and linux, so the committed darwin references cannot
  # be compared here. The job generates the linux set, uploads it for review,
  # and FAILS with instructions. It never commits them — re-blessing is an
  # explicit human commit (scripts/visual/rebless.sh, e2e/visual/README.md).
  visual-regression:
    name: Visual Regression (advisory)
    needs: install
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      # ⚠ COUNTED WITH A GLOB, NOT WITH `ls`. The first version of this step ran
      # `ls -1 …/*.png | wc -l`, and GitHub's default shell is
      # `bash --noprofile --norc -e -o pipefail`: with no matches `ls` exits 1,
      # `-e` kills the step BEFORE the output is written, and every downstream
      # `if:` then compares against an EMPTY string rather than '0'. Reproduced
      # exactly. `nullglob` + array length cannot fail, so the zero case is a
      # real measured zero instead of a step that died on the way to saying so.
      - name: Are there linux references to compare against?
        id: refs
        run: |
          shopt -s nullglob
          files=(e2e/visual/references/linux/*.png)
          count=${#files[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count committed linux reference image(s)."

      - name: Compare against committed linux references
        if: steps.refs.outputs.count != '0'
        run: pnpm run visual

      - name: Generate linux references for review (no references committed yet)
        if: steps.refs.outputs.count == '0'
        run: |
          set -o pipefail
          echo "::warning::No linux visual references are committed. Generating them for human review."
          VISREG_BLESS=1 pnpm exec playwright test -c playwright.visual.config.ts --reporter=list

      - name: Upload generated references for review
        if: always() && steps.refs.outputs.count == '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-references-generated-linux
          path: e2e/visual/references/linux
          retention-days: 14
          if-no-files-found: error

      # A generated-reference run has compared NOTHING. Saying so is the whole
      # point: an unmeasured state must read as unmeasured, never as a pass.
      # `always()` on purpose: if generation itself failed, the operator still
      # needs to be told that NOTHING WAS COMPARED. Without it this step is
      # skipped by the earlier failure and the loud instruction never prints —
      # which happened on the first run.
      - name: Fail — linux references absent, nothing was compared
        if: always() && steps.refs.outputs.count == '0'
        run: |
          echo "::error::No linux visual references were committed, so this run compared NOTHING."
          echo "::error::Download the 'visual-references-generated-linux' artifact, LOOK AT THE IMAGES,"
          echo "::error::and commit them to e2e/visual/references/linux/ as their own reviewable commit."
          exit 1

      - name: Upload diffs and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual
            test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo '### Visual regression (advisory — does not block merges)'
            echo ''
            if [ -f test-results/visual-selftest/selftest-report.txt ]; then
              echo 'Self-test measurement — the tolerance must separate noise from a real regression:'
              echo ''
              echo '```'
              cat test-results/visual-selftest/selftest-report.txt
              echo '```'
            fi
            if [ -f test-results/visual-manifest.txt ]; then
              echo ''
              echo 'States captured this run:'
              echo ''
              echo '```'
              cat test-results/visual-manifest.txt
              echo '```'
            else
              echo ''
              echo '⚠ No capture manifest — this run captured nothing.'
            fi
            echo ''
            echo 'Failed comparisons upload `-expected` / `-actual` / `-diff` images in the'
            echo '`visual-regression-report` artifact. Adjudicate the image, do not guess from a ratio.'
            echo 'To accept a change: `scripts/visual/rebless.sh`, review, and commit the references on their own.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── System E · the Core PoC mounted-browser suite ─────────────────────
  #
  # WHY THIS JOB EXISTS AT ALL. System E shipped with no npm script and no CI job.
  # Its pull request reported "14/14 CI success" — a figure that was true and
  # entirely silent about these specs, because CI had never executed one of them.
  # A falsification engine that never runs falsifies nothing; it is a suite that
  # exists. This job is the difference between the two.
  #
  # ⚠ ADVISORY ON PURPOSE. `continue-on-error: true`, and deliberately ABSENT from
  # the "Staging Gate" aggregator's `needs` at the end of this file — the same
  # posture, for the same reason, as `visual-regression` above. A mounted-browser
  # suite driving a MUTABLE deployed target is not a merge gate: putting a flaky
  # gate on the merge path is worse than having no gate, and the standing ruling is
  # to keep the small Core E suite and never revive the broad historical Playwright
  # estate. Promoting it is a separate, later decision, to be taken once its
  # false-positive rate has been OBSERVED rather than assumed.
  #
  # ⚠⚠ READ WHAT A RESULT HERE IS ABOUT, BEFORE READING THE COLOUR.
  # This job drives the DEPLOYED staging build. On a pull request that build is NOT
  # this branch's code — it is whatever staging was serving when the job ran. So:
  #   - a RED here is a claim about the DEPLOYED product, not about the diff;
  #   - a GREEN here is NOT evidence that this PR is safe;
  #   - the exception, and the case that motivated the job, is a PR that changes
  #     `e2e/core/**` or `playwright.core.config.ts` — there the suite under test IS
  #     the diff, and this job is the only thing that executes it.
  # The step summary prints the served build so the result is attributable at all.
  #
  # NOT SCHEDULED, and that is a fact about GitHub rather than a preference:
  # `schedule:` fires only on the default branch (`main`), so a cron added here
  # would not run these specs until they reach main. Running on every push to
  # `staging` and every PR into it gives a signal now; `workflow_dispatch` covers
  # an ad-hoc run against a pinned target.
  #
  # IT CANNOT REPORT SUCCESS HAVING EXECUTED NOTHING. `globalSetup` fails if the
  # declared spec set has drifted from the files on disk, and `globalTeardown`
  # fails on a zero-ran run — unconditionally, including under `CORE_PARTIAL=1`.
  # Both are pinned by `tests/ci-guards/core-completeness-guard.spec.ts`, which
  # runs in the REQUIRED suite above, so the guard is protected even though the
  # browser suite is advisory.
  core-e2e:
    name: Core E2E · System E (advisory)
    needs: install
    runs-on: ubuntu-latest
    continue-on-error: true
    # 30 -> 45. The resolve step now waits up to 15 minutes for Netlify to publish the
    # pushed commit (the one-commit lag is the normal case, not an edge case), and the
    # suite itself runs ~5 minutes after a ~3 minute install. 30 left no headroom for a
    # slow Netlify build, and a job killed by its own timeout looks like a hang.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      # ⭐⭐ RESOLVE AN IMMUTABLE TARGET BEFORE THE BROWSER STARTS.
      #
      # THE DEFECT THIS REPLACES, MEASURED 2026-08-29. This step used to read the
      # MUTABLE ALIAS once and hand it straight to the run. All 13 Core E2E jobs ever
      # executed on `staging` failed; TWELVE failed on `BUILD DRIFTED MID-RUN`, and
      # every one of the twelve STARTED ON THE PREVIOUS COMMIT and ended on the pushed
      # one. The push that starts this workflow also starts the Netlify build, so by
      # the time this step ran the alias still served the old build, and Netlify
      # published underneath the specs. EIGHT of those runs were 3/3 green — about a
      # build that did not contain the push. The suite has never measured its own commit.
      #
      # THE ONE-COMMIT LAG IS THE NORMAL CASE, so the resolver WAITS for the expected
      # commit, pins the immutable Netlify permalink out of the same /version.json body
      # that carried it, VERIFIES that permalink answers and identifies itself, and
      # FAILS rather than falling back. Full argument in the script header.
      #
      # `CORE_EXPECT_COMMIT` is set ONLY for a push to `staging`, where `github.sha` IS
      # the commit Netlify builds. On a pull_request `github.sha` is a merge commit
      # Netlify never deploys, so demanding it would time out every time; there the
      # resolver pins whatever is live instead — attribution without targeting, which
      # is exactly what a PR result is worth (see the header above this job).
      - name: Resolve an immutable target
        id: target
        env:
          CORE_UI_URL: ${{ github.event.inputs.core_ui_url || 'https://staging--olumi.netlify.app' }}
          CORE_EXPECT_COMMIT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/staging') && github.sha || '' }}
          CORE_RESOLVE_BUDGET_MS: '900000'
          CORE_RESOLVE_POLL_MS: '10000'
        run: |
          set -o pipefail
          # Writes url/build/short/deploy_id to $GITHUB_OUTPUT itself, and exits
          # non-zero with the reason if it cannot name a build. No `|| true`: an
          # unresolvable target must stop the job, not start a run nobody may cite.
          node scripts/core-e2e/resolve-immutable-target.mjs > /dev/null
          echo "Workflow ref is ${{ github.sha }} — the same as the build measured ONLY on a push to staging."

      - name: Run System E
        env:
          # The IMMUTABLE deploy permalink, not the alias. `globalTeardown`'s drift
          # guard stays fully armed against it — on this target it can no longer fire,
          # which is the point: the guard becomes a proof instead of a sample.
          CORE_UI_URL: ${{ steps.target.outputs.url }}
        run: pnpm run e2e:core

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-e2e-report
          path: |
            playwright-report-core/
            test-results/core/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo '### Core E2E · System E (advisory — does not block merges)'
            echo ''
            # Single-quoted ON PURPOSE: these values are substituted by Actions
            # before the shell sees them, and a backtick inside DOUBLE quotes is
            # command substitution — bash would try to EXECUTE the URL.
            echo '| what | value |'
            echo '| --- | --- |'
            echo '| **Target driven (IMMUTABLE)** | `${{ steps.target.outputs.url }}` |'
            echo '| **Build measured** | `${{ steps.target.outputs.build }}` |'
            echo '| Deploy id | `${{ steps.target.outputs.deploy_id }}` |'
            echo '| Workflow ref | `${{ github.sha }}` |'
            echo ''
            echo 'The target is a Netlify deploy PERMALINK, resolved before the browser started'
            echo 'and verified to serve that build. It cannot move, so "the build measured" above'
            echo 'is the build every spec in this run drove — and the URL still serves it, so a'
            echo 'green here is re-checkable months later. That was not true while this job drove'
            echo 'the `staging--olumi.netlify.app` alias: 12 of the 13 runs before this change'
            echo 'straddled a deploy, every one of them starting on the PREVIOUS commit.'
            echo ''
            echo '⚠ On a PULL REQUEST the build measured is NOT this branch — it is whatever'
            echo 'staging was serving, pinned. A result is a claim about the DEPLOYED product,'
            echo 'unless the diff touches `e2e/core/**`. On a push to `staging` they are the same'
            echo 'commit, because the resolver waits for that commit specifically.'
            echo ''
            if [ -f test-results/core/spec-manifest.json ]; then
              echo 'Specs this run actually executed (recorded at spec START, not at pass):'
              echo ''
              echo '```json'
              cat test-results/core/spec-manifest.json
              echo '```'
            else
              echo '⚠ No spec manifest — this run recorded nothing. `globalSetup` did not'
              echo 'complete, so the failure is upstream of the specs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Full test suite (sharded 4-way) ───────────────────────────────────
  vitest:
    name: Full Test Suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Bounded so a teardown hang (mode A) or a genuine JS-side hang (e.g.
      # an infinite render loop — the actual chronic-red root cause, see
      # workflow header) fails fast instead of running to GitHub's 6-hour
      # default. Each shard carries ~1/4 the files, so 15 min is generous
      # headroom over the ~4-5 min a healthy shard takes.
      #
      # We capture vitest's REAL exit code (PIPESTATUS[0], not tee's) and force
      # the step to exit 0 so the "Evaluate" step below is the single pass/fail
      # arbiter. On a timeout the runner kills this step mid-command, so the
      # exit_code echo never runs and steps.vitest.outputs.exit_code is empty —
      # that empty value is how Evaluate distinguishes a timeout/kill from a
      # completed-but-non-zero run.
      # --no-color plus NO_COLOR/FORCE_COLOR=0 belt-and-suspenders the CLI flag
      # against a runner env that forces color (GitHub Actions' terminal
      # sometimes reports as a TTY to child processes). The sed pass after
      # tee is a second, independent backstop: even if colour leaks through
      # some path we haven't seen, the file the Evaluate step parses (and the
      # artifact a human downloads) is guaranteed plain text. Without this,
      # a genuinely-green shard's "Test Files ... passed" summary line is
      # broken up by embedded ANSI escape codes and the single-line regex
      # below never matches it — a real PASS misreported as a parse failure.
      - name: Run test suite (shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }})
        id: vitest
        timeout-minutes: 15
        run: |
          set +e
          pnpm exec vitest run --reporter=verbose --no-color --shard=${{ matrix.shard }}/${{ env.SHARD_COUNT }} 2>&1 | tee vitest-output.raw.txt
          code=${PIPESTATUS[0]}
          sed -E 's/\x1b\[[0-9;]*m//g' vitest-output.raw.txt > vitest-output.txt
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "vitest exited with code ${code}"
          exit 0
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
          NO_COLOR: "1"
          FORCE_COLOR: "0"

      # Preserve the test log on every outcome (pass, fail, timeout, cancel) so
      # a hung/cancelled run is still diagnosable. Test log only — no secrets or
      # environment dumps. Placed before Evaluate so it survives a non-zero gate.
      # Per-shard name (upload-artifact v4 requires unique names within a run).
      - name: Upload vitest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output-shard-${{ matrix.shard }}
          path: vitest-output.txt
          if-no-files-found: warn
          retention-days: 14

      # Single pass/fail arbiter for this shard. Combines:
      #  - timeout/kill detection (empty exit_code from the step above),
      #  - genuine test-failure detection (failed counts in the summary),
      #  - defence-in-depth against bail-like under-reporting (file-count
      #    thresholds — vitest hitting --bail=N marks queued-but-never-started
      #    files as "skipped"; a healthy shard skips ~0-2, scaled down from the
      #    unsharded suite's ~4 baseline / ~653 audited-bad case), and
      #  - tolerance for the KNOWN teardown ERR_WORKER_OUT_OF_MEMORY signature
      #    (mode B) — and ONLY that signature — when zero tests failed.
      # if: always() so it still fires when vitest exits non-zero or is killed.
      #
      # min_total is NOT checked per-shard (an uneven-but-valid file split
      # across 4 shards could legitimately put one shard under any fixed
      # floor) — the cross-shard total is checked once in the "Full Test
      # Suite Summary" job below, against the same 700-file floor the
      # unsharded job used.
      - name: Evaluate test results
        if: always()
        env:
          VITEST_EXIT: ${{ steps.vitest.outputs.exit_code }}
        run: |
          # Disable errexit: grep "no match" assignments (e.g. the no-failures
          # fallback summary) exit non-zero and, under the runner's default
          # `bash -eo pipefail`, a failing `var=$(grep ... | tail)` would abort
          # the step before we reach our explicit checks. Every failure path
          # below ends in an explicit `exit`, so this cannot mask a real failure.
          set +e
          if [ ! -f vitest-output.txt ]; then
            echo "::error::vitest-output.txt missing — the test step failed to start."
            exit 1
          fi
          # Empty exit_code => the step was killed before it could report its
          # exit (15-min timeout or runner cancellation). Mode A.
          if [ -z "${VITEST_EXIT}" ]; then
            echo "::error::Shard ${{ matrix.shard }} did not complete — it timed out (15 min) or was cancelled before reporting. This is a CI hang, not a test failure; inspect the 'vitest-output-shard-${{ matrix.shard }}' artifact to see how far it got."
            tail -30 vitest-output.txt || true
            exit 1
          fi
          # Summary line shape (both the "failed" and "skipped" clauses are
          # OPTIONAL — vitest omits a clause entirely when its count is zero,
          # it does NOT print "0 skipped"):
          #   " Test Files  14 failed | 734 passed | 4 skipped (755)"  (failures + skipped)
          #   " Test Files  14 failed | 734 passed (748)"              (failures, 0 skipped)
          #   " Test Files  734 passed | 4 skipped (738)"              (0 failures, skipped)
          #   " Test Files  734 passed (734)"                          (0 failures, 0 skipped)
          summary=$(grep -oE '^\s*Test Files +([0-9]+ failed \| )?[0-9]+ passed( \| [0-9]+ skipped)? \([0-9]+\)' vitest-output.txt | tail -1)
          if [ -z "$summary" ]; then
            echo "::error::could not parse 'Test Files' summary from vitest output (crash before summary?). Exit code was ${VITEST_EXIT}."
            tail -30 vitest-output.txt
            exit 1
          fi
          echo "Parsed summary: ${summary}"
          total=$(echo "$summary" | grep -oE '\([0-9]+\)' | tr -d '()')
          skipped=$(echo "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+')
          files_failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | tail -1)
          files_failed=${files_failed:-0}
          # Individual-test failures: " Tests  3 failed | 6215 passed | 1 skipped (6219)"
          tests_failed=$(grep -oE '^\s*Tests +[0-9]+ failed' vitest-output.txt | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | tail -1)
          tests_failed=${tests_failed:-0}
          has_oom=$(grep -c 'ERR_WORKER_OUT_OF_MEMORY' vitest-output.txt || true)
          has_oom=${has_oom:-0}
          echo "exit=${VITEST_EXIT} files_failed=${files_failed} tests_failed=${tests_failed} total=${total} skipped=${skipped} oom=${has_oom}"
          fail=0
          # Genuine test failures are NEVER tolerated.
          if [ "${files_failed}" -gt 0 ] || [ "${tests_failed}" -gt 0 ]; then
            echo "::error::Test failures detected: ${files_failed} file(s), ${tests_failed} test(s). This is a real failure, not an infra issue."
            fail=1
          fi
          # A non-zero exit with zero failures is tolerated ONLY for the known
          # teardown/worker OOM signature — the exact string ERR_WORKER_OUT_OF_MEMORY
          # documented in docs/ops/vitest-full-suite-oom-diagnosis.md and matched by
          # the local pre-push gate (scripts/pre-push-validate.sh), so CI and local
          # share one OOM signature (the CI pass/fail evaluator is otherwise
          # stricter). Kept deliberately narrow: erring narrow fails SAFE —
          # an unmatched OOM yields a false FAILURE (gate red, artifact kept for a
          # human) rather than a false PASS. A broader match (e.g. bare "JavaScript
          # heap out of memory") could tolerate a parent-process heap death that
          # should fail. Broadening to the fuller teardown signature is a
          # deliberately-deferred future hardening, not a gap in this gate.
          if [ "${VITEST_EXIT}" -ne 0 ] && [ "${fail}" -eq 0 ]; then
            if [ "${has_oom}" -gt 0 ]; then
              echo "::warning::vitest exited ${VITEST_EXIT} but every test passed; tolerating the known teardown ERR_WORKER_OUT_OF_MEMORY (see docs/ops/vitest-full-suite-oom-diagnosis.md)."
            else
              echo "::error::vitest exited ${VITEST_EXIT} with zero reported failures and no ERR_WORKER_OUT_OF_MEMORY signature — unexplained non-zero exit, not tolerated."
              fail=1
            fi
          fi
          exit $fail

  # ── Full Test Suite Summary (cross-shard defence-in-depth) ────────────
  # The per-shard "Evaluate test results" step catches genuine failures and
  # hangs within each shard; this job catches the one thing that requires
  # seeing all shards together — silent under-collection (e.g. an exclusion
  # pattern or --bail reintroduced) that a single shard's local count can't
  # detect on its own. Runs even if a shard failed (if: always()) so its
  # own errors don't mask the real per-shard failure already surfaced.
  vitest-summary:
    name: Full Test Suite Summary
    needs: vitest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all shard outputs
        if: needs.vitest.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-output-shard-*
          path: shard-outputs
          merge-multiple: false

      - name: Sum cross-shard totals
        if: needs.vitest.result != 'skipped'
        run: |
          set +e
          min_total=700
          max_skipped=50
          total_sum=0
          skipped_sum=0
          missing=0
          for f in shard-outputs/*/vitest-output.txt; do
            [ -f "$f" ] || { missing=1; continue; }
            # Both the "failed" and "skipped" clauses are OPTIONAL — vitest
            # omits a clause entirely when its count is zero (see the
            # per-shard "Evaluate test results" step above for the full
            # shape breakdown).
            summary=$(grep -oE '^\s*Test Files +([0-9]+ failed \| )?[0-9]+ passed( \| [0-9]+ skipped)? \([0-9]+\)' "$f" | tail -1)
            if [ -z "$summary" ]; then
              echo "::warning::could not parse a Test Files summary from $f (shard likely timed out/crashed — already caught by that shard's own Evaluate step)."
              continue
            fi
            t=$(echo "$summary" | grep -oE '\([0-9]+\)' | tr -d '()')
            s=$(echo "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+')
            total_sum=$((total_sum + t))
            skipped_sum=$((skipped_sum + s))
          done
          echo "Cross-shard total=${total_sum} skipped=${skipped_sum} (thresholds: total>=${min_total}, skipped<=${max_skipped})"
          fail=0
          if [ "${missing}" -eq 1 ]; then
            echo "::error::One or more shard output artifacts were missing entirely."
            fail=1
          fi
          if [ "${total_sum}" -lt "${min_total}" ]; then
            echo "::error::Discovered ${total_sum} test files across all shards, below minimum ${min_total}. Likely cause: config exclusions expanded or files removed from src/tests."
            fail=1
          fi
          if [ "${skipped_sum}" -gt "${max_skipped}" ]; then
            echo "::error::${skipped_sum} test files reported as skipped across all shards (max ${max_skipped}). Likely cause: --bail=N reintroduced (see docs/ui/ci-test-coverage-audit.md §1) or large it.skip() block added."
            fail=1
          fi
          exit $fail

      - name: Shard matrix result
        run: |
          echo "vitest matrix result: ${{ needs.vitest.result }}"
          if [ "${{ needs.vitest.result }}" != "success" ]; then
            echo "::error::At least one shard did not succeed — see that shard's job log/artifact for the reason (hang, OOM, or genuine failure)."
            exit 1
          fi

  # ── Build ────────────────────────────────────────────────────────────
  build:
    name: Production Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm run build

      # ⚠ WIRED HERE ON PURPOSE, NOT ONLY IN ci.yml.
      #
      # `staging` branch protection requires exactly ONE check: "Staging Gate",
      # whose `needs` list is [tsc, typecheck-selftest, vitest, vitest-summary,
      # build]. Nothing in ci.yml is required, so a credential guard living only
      # there would advise and never block — the same shape as the defect it
      # exists to catch (the previous allow-list guard printed a 🚨 about a live
      # credential on every run and exited 0).
      #
      # It runs AFTER the build in the job the gate already depends on, so it
      # scans the artefact this job just produced and its failure fails the gate.
      # Derived 2026-08-13:
      #   gh api repos/Talchain/DecisionGuideAI/branches/staging/protection \
      #     --jq '.required_status_checks.contexts'   → ["Staging Gate"]
      # Re-derive before assuming this is still where the blocking happens.
      - name: No credentials in the emitted bundle (value-shape scan)
        run: pnpm run ci:guard:bundle-credentials

      # The instrument this protects is the reason the fence in #913 can be
      # witnessed at all. Until 2026-08-28 every method of `src/lib/logger.ts`
      # compiled to `(...e)=>{gate("warn")}` in production — gate evaluated, call
      # stripped — so a fence that FIRED and one that did not were
      # indistinguishable on a deployed build.
      #
      # ⚠ WIRED HERE, IN THE `build` JOB, ON PURPOSE. A source-level spec cannot
      # see a build-time strip: a jsdom test asserting the logger emits passed
      # green throughout the whole defect. Only an assertion against the emitted
      # artefact can hold it closed, and only a step inside a job the required
      # check depends on can block a merge.
      #   Derived 2026-08-28:
      #     gh api repos/Talchain/DecisionGuideAI/branches/staging/protection \
      #       --jq '.required_status_checks.contexts'   → ["Staging Gate"]
      - name: Application logger still emits in the built bundle
        run: pnpm run ci:guard:logger-emits

      # ⚠ WIRED HERE, AFTER THE BUILD, IN THE JOB THE GATE ALREADY DEPENDS ON.
      # Same reasoning as the two guards above: `staging` protection requires
      # exactly ONE check, "Staging Gate", whose `needs` is [tsc,
      # typecheck-selftest, vitest, vitest-summary, build]. Nothing in ci.yml is
      # required, so a guard living only there would advise and never block.
      #   Derived 2026-08-29:
      #     gh api repos/Talchain/DecisionGuideAI/branches/staging/protection \
      #       --jq '.required_status_checks.contexts'   → ["Staging Gate"]
      #
      # `src/generated/validators.js` is COMMITTED (src/poc/io/validate.ts
      # imports it, and that import is reached from vitest, where no generation
      # step runs) and regenerated by every `pnpm run build`. So a
      # non-deterministic generator dirties the tree on every build — which is
      # precisely what a `Generated at: <clock>` header did until 2026-08-29.
      # The guard regenerates twice, requires byte-identical output, and requires
      # the committed artefact to match. It replaces the timestamp as the
      # staleness signal, and unlike the timestamp it MEASURES freshness rather
      # than asserting it.
      - name: Generated validators are deterministic and up to date
        run: pnpm run ci:guard:validators-deterministic

      # The behavioural form of the same property, and the one a human actually
      # feels: a clean checkout plus one build must leave `git status` clean.
      # Deliberately whole-tree rather than scoped to src/generated — if any
      # future build step starts writing a tracked file, this is where it
      # surfaces, loudly, instead of showing up as mystery churn in someone
      # else's commit.
      - name: The build left the working tree clean
        run: |
          set -o pipefail
          DIRTY="$(git status --porcelain)"
          if [ -n "$DIRTY" ]; then
            echo "::error::pnpm run build modified tracked files. A build must not dirty the tree — it destroys 'git status' as a verification signal and the churn gets staged into unrelated commits."
            echo "$DIRTY"
            git diff --stat
            exit 1
          fi
          echo "✅ working tree clean after pnpm run build"

  # ── Gate (single required check for branch protection) ───────────────
  gate:
    name: Staging Gate
    needs: [tsc, typecheck-selftest, vitest, vitest-summary, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo "Job results:"
          echo "  tsc:                 ${{ needs.tsc.result }}"
          echo "  typecheck-selftest:  ${{ needs.typecheck-selftest.result }}"
          echo "  vitest:              ${{ needs.vitest.result }}"
          echo "  vitest-summary:      ${{ needs.vitest-summary.result }}"
          echo "  build:               ${{ needs.build.result }}"
          if [ "${{ needs.tsc.result }}" != "success" ] || \
             [ "${{ needs.typecheck-selftest.result }}" != "success" ] || \
             [ "${{ needs.vitest.result }}" != "success" ] || \
             [ "${{ needs.vitest-summary.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Staging Gate failed — one or more jobs did not succeed (see results above)."
            # The Full Test Suite job (4-way shard matrix) is the authority on
            # test outcome: each shard's "Evaluate test results" step prints a
            # precise reason and its 'vitest-output-shard-N' artifact preserves
            # the log on every outcome; vitest-summary catches cross-shard
            # under-collection. A timeout/hang ('failure'/'cancelled' with an
            # "did not complete" error), an OOM-tolerated pass ('success' + a
            # ::warning::), and a genuine test failure all look different
            # there — check the specific shard's log first.
            if [ "${{ needs.vitest.result }}" != "success" ]; then
              echo "::error::vitest is '${{ needs.vitest.result }}'. Open the failing shard's job log + download its 'vitest-output-shard-N' artifact to tell a CI hang/timeout apart from a real test failure."
            fi
            if [ "${{ needs.vitest-summary.result }}" != "success" ]; then
              echo "::error::vitest-summary is '${{ needs.vitest-summary.result }}' — cross-shard test-file count fell below the floor, or a shard artifact was missing. Open its job log."
            fi
            if [ "${{ needs.typecheck-selftest.result }}" != "success" ]; then
              echo "::error::typecheck-selftest is '${{ needs.typecheck-selftest.result }}' — the typecheck gate did NOT go red when it should have. Treat every 'typecheck clean' claim on this branch as UNPROVEN until it passes."
            fi
            exit 1
          fi
          echo "All jobs passed."
