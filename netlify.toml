[build]
  command = "npm run build:ci && node scripts/assert-entry.cjs && echo '{\"commit\":\"'$(git rev-parse HEAD)'\",\"short\":\"'$(git rev-parse --short HEAD)'\",\"branch\":\"'$(git rev-parse --abbrev-ref HEAD)'\",\"timestamp\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > dist/version.json"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PLC_LAB = "1"
  VITE_POC_ONLY = "0"
  VITE_COPILOT_ENABLED = "true"
  VITE_FEATURE_PLOT_USES_PLC_CANVAS = "1"
  VITE_AUTH_MODE = "guest"
  VITE_EDGE_GATEWAY_URL = "/engine"
  VITE_DISABLE_OPENAI = "1"
  VITE_FORCE_ENGINE = "1"
  VITE_FEATURE_SSE = "1"
  VITE_FEATURE_SCENARIO_SANDBOX = "1"
  VITE_FEATURE_SANDBOX_DECISION_CTA = "1"
  VITE_FEATURE_SANDBOX_MAPPING = "1"
  VITE_FEATURE_SANDBOX_PROJECTIONS = "1"
  VITE_FEATURE_SANDBOX_REALTIME = "1"
  VITE_FEATURE_SANDBOX_STRATEGY_BRIDGE = "1"
  VITE_FEATURE_SANDBOX_TRIGGERS_BASIC = "1"
  VITE_FEATURE_SANDBOX_VOTING = "1"
  VITE_FEATURE_WHITEBOARD = "1"
  SECRETS_SCAN_ENABLED = "false"
  # Brief E Task 4: New capability feature flags for staging QA
  VITE_FEATURE_GOAL_PROBABILITIES = "1"
  VITE_FEATURE_ISL_SYNTHESIS = "1"
  # Phase 1B: PLoT Enrichment Routing
  # When "1": UI reads robustness/validation from PLoT enrichment (eliminates ISL dual-pipeline)
  # When "0": UI calls ISL directly (legacy behavior)
  # Enable via Netlify dashboard for staged rollout, monitor error rates via PostHog/Sentry
  VITE_USE_PLOT_ENRICHMENT = "1"
  # Orchestrator V2 — AI conversation pipeline
  VITE_ENABLE_ORCHESTRATOR_V2 = "true"

# =============================================================================
# Staging-only env overrides
# Netlify's deploy-context syntax scopes env vars to a specific branch's
# builds. `[context.staging.environment]` applies only to builds for the
# `staging` branch (which Netlify deploys to `staging--olumi.netlify.app`).
# The production context (main) inherits ONLY from `[build.environment]`
# above, so flags listed here stay off in production until explicitly
# promoted.
# =============================================================================
[context.staging.environment]
  # aiPanelV2 — floating-first Olumi UX (PR #148 + PR #149).
  # Enabled on staging for manual testing. Promote to production by
  # adding to `[build.environment]` ONLY after sign-off.
  VITE_FEATURE_AI_PANEL_V2 = "true"

  # Debug panel + payload-trace-store env gate (PR #156 follow-up).
  # `VITE_APP_ENV=staging` makes:
  #   1. `<DebugPanel />` (mounted in AppPoC) eligible when the user
  #      adds `?diag` / `?diag=1` to the URL OR sets
  #      `window.__OLUMI_DEBUG = true` in the console. `<DebugPanel />`
  #      refuses to render unless `VITE_APP_ENV ∈ {staging, development}`
  #      — see `src/components/DebugPanel.tsx :: shouldShowDebugPanel`.
  #   2. The payload-trace-store env gate (PR #152, PR #156) report
  #      `payload_inspection_status.enabled === true` with reason
  #      `app_env_staging_enabled` — see
  #      `src/lib/payload-trace-store.ts :: determinePayloadInspectionStatus`.
  # Production (main) does NOT inherit this; the trace-store gate stays
  # closed by default and the debug panel refuses to render.
  VITE_APP_ENV = "staging"

  # Analysis hero panel — answer-first lens hero above the existing
  # Analysis-tab hero (read-only, feature-flagged). Enabled on staging for
  # QA; promote to production by adding to `[build.environment]` ONLY after
  # sign-off. See src/flags.ts `analysisHeroPanel`.
  VITE_FEATURE_ANALYSIS_HERO_PANEL = "1"

  # Engine direct-fallback origin (run-path reliability). When the Netlify
  # /bff/engine proxy hop returns a gateway error (504/502) for an analysis
  # run, the plot client retries ONCE against this origin directly — the same
  # service the proxy targets (already in CSP connect-src; PLoT's CORS
  # allow-list accepts the client's headers). Empty/unset disables the
  # fallback entirely — production stays proxy-only until promoted after
  # sign-off. See src/adapters/plot/v1/http.ts :: getDirectFallbackBase.
  VITE_ENGINE_DIRECT_FALLBACK_URL = "https://plot-lite-service-staging.onrender.com"

# =============================================================================
# Security Headers (P0 - Enterprise Compliance)
# =============================================================================

[[headers]]
  for = "/*"
  [headers.values]
  # CSP: Content Security Policy
  # script-src 'unsafe-inline': Required as base, replaced with nonce by csp-nonce edge function
  #   The edge function injects cryptographic nonces into inline scripts and updates CSP header
  # style-src 'unsafe-inline': Required for Tailwind CSS and React CSS-in-JS (cannot be nonce-protected)
  #   Tailwind and component libraries inject runtime styles that cannot use nonces
  # connect-src: Pinned to specific Render subdomains (tightened from *.onrender.com).
  # In production, all service calls route through /bff/* (same-origin) via Netlify redirects/edge functions.
  # These explicit entries cover local dev overrides (VITE_CEE_DRAFT_BASE, VITE_ISL_BFF_BASE).
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plot-lite-service-staging.onrender.com https://olumi-assistants-service.onrender.com https://cee-staging.onrender.com https://isl-staging.onrender.com https://*.supabase.co https://api.openai.com wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
  # Prevent clickjacking
  X-Frame-Options = "DENY"
  # Prevent MIME sniffing
  X-Content-Type-Options = "nosniff"
  # Control referrer information
  Referrer-Policy = "strict-origin-when-cross-origin"
  # Restrict browser features
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
  cache-control = "no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/bff/engine/*"
  to = "https://plot-lite-service-staging.onrender.com/:splat"
  status = 200
  force = true

# CEE (Assistants) Service - graph-readiness endpoint
# Routes /bff/cee/* → https://olumi-assistants-service.onrender.com/assist/v1/*
# Required for Results Panel confidence tier display
[[redirects]]
  from = "/bff/cee/*"
  to = "https://olumi-assistants-service.onrender.com/assist/v1/:splat"
  status = 200
  force = true
  headers = {X-Olumi-Assist-Key = "${ASSIST_API_KEY}"}

# CEE fallback route for /v1/cee/* path pattern
# Handles requests when VITE_CEE_BFF_BASE points to /v1/cee instead of /bff/cee
[[redirects]]
  from = "/v1/cee/*"
  to = "https://olumi-assistants-service.onrender.com/assist/v1/:splat"
  status = 200
  force = true
  headers = {X-Olumi-Assist-Key = "${ASSIST_API_KEY}"}

# =============================================================================
# Edge Functions (security-critical functions listed first for audit clarity)
# =============================================================================

# CSP Nonce Injection - MUST run before other edge functions on HTML responses
# Generates per-request cryptographic nonces for inline scripts
# Replaces 'unsafe-inline' with nonce-based CSP for security hardening
[[edge_functions]]
  function = "csp-nonce"
  path = "/*"
  # Keep API proxy routes OUT of the edge-function hop. The in-code config in
  # csp-nonce.ts already excludes /bff/* — but THIS declaration registers a
  # second route with no exclusions, which put every /bff/engine POST through
  # the Deno isolate before the proxy redirect. Browser analysis runs were
  # 504ing through that hop while identical curl requests succeeded
  # (2026-07-05 wire evidence, graph coaching audit).
  excludedPath = ["/bff/*", "/assets/*"]

# ISL Service proxy - handled by Edge Function for auth header injection
# Requires ISL_API_KEY env var in Netlify dashboard
[[edge_functions]]
  function = "isl-proxy"
  path = "/bff/isl/*"

# Orchestrator proxy - handles CORS for CEE orchestrator endpoint
# CEE backend lacks CORS middleware on /orchestrate/* routes
[[edge_functions]]
  function = "orchestrator-proxy"
  path = "/bff/orchestrate/*"
