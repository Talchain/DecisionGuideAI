[build]
  command = "npm run build:ci && node scripts/assert-entry.cjs && echo '{\"commit\":\"'$(git rev-parse HEAD)'\",\"short\":\"'$(git rev-parse --short HEAD)'\",\"branch\":\"'$(git rev-parse --abbrev-ref HEAD)'\",\"timestamp\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > dist/version.json"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PLC_LAB = "1"
  VITE_POC_ONLY = "0"
  VITE_COPILOT_ENABLED = "true"
  VITE_FEATURE_PLOT_USES_PLC_CANVAS = "1"
  VITE_AUTH_MODE = "guest"
  VITE_EDGE_GATEWAY_URL = "/engine"
  VITE_DISABLE_OPENAI = "1"
  VITE_FORCE_ENGINE = "1"
  VITE_FEATURE_SSE = "1"
  VITE_FEATURE_SCENARIO_SANDBOX = "1"
  VITE_FEATURE_SANDBOX_DECISION_CTA = "1"
  VITE_FEATURE_SANDBOX_MAPPING = "1"
  VITE_FEATURE_SANDBOX_PROJECTIONS = "1"
  VITE_FEATURE_SANDBOX_REALTIME = "1"
  VITE_FEATURE_SANDBOX_STRATEGY_BRIDGE = "1"
  VITE_FEATURE_SANDBOX_TRIGGERS_BASIC = "1"
  VITE_FEATURE_SANDBOX_VOTING = "1"
  VITE_FEATURE_WHITEBOARD = "1"
  SECRETS_SCAN_ENABLED = "false"
  # Brief E Task 4: New capability feature flags for staging QA
  VITE_FEATURE_GOAL_PROBABILITIES = "1"
  VITE_FEATURE_ISL_SYNTHESIS = "1"
  # Phase 1B: PLoT Enrichment Routing
  # When "1": UI reads robustness/validation from PLoT enrichment (eliminates ISL dual-pipeline)
  # When "0": UI calls ISL directly (legacy behavior)
  # Enable via Netlify dashboard for staged rollout, monitor error rates via PostHog/Sentry
  VITE_USE_PLOT_ENRICHMENT = "1"

# =============================================================================
# Functions Configuration
# =============================================================================
[functions]
  # Increase timeout for CEE draft requests which can take ~40s
  timeout = 60

# =============================================================================
# Security Headers (P0 - Enterprise Compliance)
# =============================================================================

[[headers]]
  for = "/*"
  [headers.values]
  # CSP: Content Security Policy
  # script-src 'unsafe-inline': Required as base, replaced with nonce by csp-nonce edge function
  #   The edge function injects cryptographic nonces into inline scripts and updates CSP header
  # style-src 'unsafe-inline': Required for Tailwind CSS and React CSS-in-JS (cannot be nonce-protected)
  #   Tailwind and component libraries inject runtime styles that cannot use nonces
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com https://*.supabase.co https://api.openai.com wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
  # Prevent clickjacking
  X-Frame-Options = "DENY"
  # Prevent MIME sniffing
  X-Content-Type-Options = "nosniff"
  # Control referrer information
  Referrer-Policy = "strict-origin-when-cross-origin"
  # Restrict browser features
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
  cache-control = "no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/bff/engine/*"
  to = "https://plot-lite-service-staging.onrender.com/:splat"
  status = 200
  force = true

# =============================================================================
# Edge Functions (security-critical functions listed first for audit clarity)
# =============================================================================

# CSP Nonce Injection - MUST run before other edge functions on HTML responses
# Generates per-request cryptographic nonces for inline scripts
# Replaces 'unsafe-inline' with nonce-based CSP for security hardening
[[edge_functions]]
  function = "csp-nonce"
  path = "/*"

# CEE (Assistants) Service proxy - DEPRECATED (removed Jan 2026)
# CEE calls now route through PLoT which handles auth and has 120s timeout
# UI sets VITE_CEE_BFF_BASE to PLoT's /v1/cee endpoint
# Old edge function removed to avoid confusion

# ISL Service proxy - handled by Edge Function for auth header injection
# Requires ISL_API_KEY env var in Netlify dashboard
[[edge_functions]]
  function = "isl-proxy"
  path = "/bff/isl/*"
