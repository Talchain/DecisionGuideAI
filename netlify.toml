[build]
  command = "npm run build:ci && node scripts/assert-entry.cjs && echo '{\"commit\":\"'$(git rev-parse HEAD)'\",\"short\":\"'$(git rev-parse --short HEAD)'\",\"branch\":\"'$(git rev-parse --abbrev-ref HEAD)'\",\"timestamp\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > dist/version.json"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PLC_LAB = "1"
  VITE_POC_ONLY = "0"
  VITE_COPILOT_ENABLED = "true"
  VITE_FEATURE_PLOT_USES_PLC_CANVAS = "1"
  VITE_AUTH_MODE = "guest"
  VITE_EDGE_GATEWAY_URL = "/engine"
  VITE_DISABLE_OPENAI = "1"
  VITE_FORCE_ENGINE = "1"
  VITE_FEATURE_SSE = "1"
  VITE_FEATURE_SCENARIO_SANDBOX = "1"
  VITE_FEATURE_SANDBOX_DECISION_CTA = "1"
  VITE_FEATURE_SANDBOX_MAPPING = "1"
  VITE_FEATURE_SANDBOX_PROJECTIONS = "1"
  VITE_FEATURE_SANDBOX_REALTIME = "1"
  VITE_FEATURE_SANDBOX_STRATEGY_BRIDGE = "1"
  VITE_FEATURE_SANDBOX_TRIGGERS_BASIC = "1"
  VITE_FEATURE_SANDBOX_VOTING = "1"
  VITE_FEATURE_WHITEBOARD = "1"
  SECRETS_SCAN_ENABLED = "false"
  # Brief E Task 4: New capability feature flags for staging QA
  VITE_FEATURE_GOAL_PROBABILITIES = "1"
  VITE_FEATURE_ISL_SYNTHESIS = "1"
  # Phase 1B: PLoT Enrichment Routing
  # When "1": UI reads robustness/validation from PLoT enrichment (eliminates ISL dual-pipeline)
  # When "0": UI calls ISL directly (legacy behavior)
  # Enable via Netlify dashboard for staged rollout, monitor error rates via PostHog/Sentry
  VITE_USE_PLOT_ENRICHMENT = "1"
  # Orchestrator V2 — AI conversation pipeline
  VITE_ENABLE_ORCHESTRATOR_V2 = "true"

# =============================================================================
# Staging-only env overrides
# Netlify's deploy-context syntax scopes env vars to a specific branch's
# builds. `[context.staging.environment]` applies only to builds for the
# `staging` branch (which Netlify deploys to `staging--olumi.netlify.app`).
# The production context (main) inherits ONLY from `[build.environment]`
# above, so flags listed here stay off in production until explicitly
# promoted.
# =============================================================================
[context.staging.environment]
  # aiPanelV2 — floating-first Olumi UX (PR #148 + PR #149).
  # Enabled on staging for manual testing. Promote to production by
  # adding to `[build.environment]` ONLY after sign-off.
  VITE_FEATURE_AI_PANEL_V2 = "true"

  # Debug panel + payload-trace-store env gate (PR #156 follow-up).
  # `VITE_APP_ENV=staging` makes:
  #   1. `<DebugPanel />` (mounted in AppPoC) eligible when the user
  #      adds `?diag` / `?diag=1` to the URL OR sets
  #      `window.__OLUMI_DEBUG = true` in the console. `<DebugPanel />`
  #      refuses to render unless `VITE_APP_ENV ∈ {staging, development}`
  #      — see `src/components/DebugPanel.tsx :: shouldShowDebugPanel`.
  #   2. The payload-trace-store env gate (PR #152, PR #156) report
  #      `payload_inspection_status.enabled === true` with reason
  #      `app_env_staging_enabled` — see
  #      `src/lib/payload-trace-store.ts :: determinePayloadInspectionStatus`.
  # Production (main) does NOT inherit this; the trace-store gate stays
  # closed by default and the debug panel refuses to render.
  VITE_APP_ENV = "staging"

  # Analysis hero panel — answer-first lens hero above the existing
  # Analysis-tab hero (read-only, feature-flagged). Enabled on staging for
  # QA; promote to production by adding to `[build.environment]` ONLY after
  # sign-off. See src/flags.ts `analysisHeroPanel`.
  VITE_FEATURE_ANALYSIS_HERO_PANEL = "1"

  # Analysis-tab rebuild Wave 1 (Decision overview + Actions menu). Paul
  # enabled this via the Netlify UI on 2026-07-12 and accepted the surface
  # live; recorded here so the repo config matches deployed reality (Codex
  # B4: config-as-source-of-truth). Promote to production by adding to
  # [build.environment] ONLY after sign-off.
  VITE_FEATURE_DECISION_OVERVIEW = "1"

  # Analysis-tab rebuild Wave 3 (Strengthen your model — adaptive coaching
  # recommendations). The parity audit found the surface fully merged but
  # DARK on staging because this promotion was missed at merge time. Promote
  # to production by adding to [build.environment] ONLY after sign-off.
  VITE_FEATURE_STRENGTHEN_PANEL = "1"

  # Front door (real sign-in) — keep the REAL Supabase SDK in the staging
  # bundle. Without this, vite.config.ts aliases @supabase/supabase-js to
  # src/stubs/supabase-stub.mjs on every guest build, and that stub does not
  # implement signInWithOtp/signInWithOAuth at all — so sign-in cannot work
  # no matter what the requireLogin flag says (the runbook in src/flags.ts
  # `requireLogin` documents exactly this trap).
  #
  # This does NOT turn guest mode off: VITE_AUTH_MODE stays "guest", so
  # unauthenticated visitors still land on the guest canvas exactly as today
  # and the other workstreams' staging QA is unaffected. It only makes real
  # sign-in POSSIBLE for anyone who opts in per-browser with
  # `localStorage.setItem('feature.requireLogin', '1')`.
  #
  # Staging-scoped deliberately — production (main) inherits only from
  # [build.environment] and keeps the stub. Promote to [build.environment]
  # ONLY after sign-off.
  VITE_STUB_SUPABASE = "0"

  # Hero fixture gallery — internal-only /dev/hero-gallery route rendering
  # prototype hero states from typed fixtures (visible internal-preview
  # banner on every instance). Staging-only for design review; never add to
  # `[build.environment]`. See src/flags.ts `heroFixtureGallery`.
  VITE_FEATURE_HERO_FIXTURE_GALLERY = "1"

  # ---------------------------------------------------------------------------
  # Dashboard-set flags recorded 2026-07-28 (ROADMAP 2.107).
  #
  # These three were set through the NETLIFY DASHBOARD and appeared nowhere in
  # this file, while all three default OFF in src/flags.ts. Any lane reading
  # flags.ts or netlify.toml to decide what a staging tester sees therefore got
  # the wrong answer, and the flag-off code paths looked DEAD when they were
  # LIVE — that mis-scoped two dispatches on 2026-07-28.
  #
  # The values below are TRANSCRIBED FROM THE SERVED BUNDLE, not assumed:
  # staging--olumi.netlify.app/assets/flags-BOFkajto.js (deploy of tip
  # c86da6a4), which carries Vite's baked `import.meta.env` literal. They are
  # byte-identical to what is already deployed, so recording them changes no
  # behaviour — it only stops the repo lying about it.
  #
  # ⚠ Recording a flag here does NOT make this file authoritative. Dashboard
  # variables still override it and remain invisible to this repo. Derive the
  # truth instead of trusting these lines: `pnpm flags:check`.
  # (tools/ci-guards/flag-deployment-drift.mjs — reads the deployed bundle.)
  #
  # That check found 13 dashboard-set divergences on 2026-07-28, not 3. The
  # other 10 are deliberately NOT transcribed here: hand-copying them would
  # rebuild the mirror this work exists to retire. Run `pnpm flags:check` for
  # the current derived list.
  #
  # Promote any of these to production by adding to [build.environment] ONLY
  # after sign-off.
  # ---------------------------------------------------------------------------

  # V5 canonical analysis path — routes every user-visible analysis trigger
  # through the V5 chip-action dispatch so CEE persists a run_analysis fact.
  # See src/flags.ts `v5CanonicalAnalysis`.
  VITE_V5_CANONICAL_ANALYSIS = "true"

  # Compare tab — renders live on staging today. See src/flags.ts `compareTab`.
  VITE_FEATURE_COMPARE_TAB = "1"

  # Pre-analysis v3 — `pre-analysis-v3-analyse` is the live pre-run CTA on
  # staging today. See src/flags.ts `preAnalysisV3`.
  VITE_FEATURE_PRE_ANALYSIS_V3 = "1"

# =============================================================================
# Security Headers (P0 - Enterprise Compliance)
# =============================================================================

[[headers]]
  for = "/*"
  [headers.values]
  # CSP: Content Security Policy
  # script-src 'unsafe-inline': Required as base, replaced with nonce by csp-nonce edge function
  #   The edge function injects cryptographic nonces into inline scripts and updates CSP header
  # style-src 'unsafe-inline': Required for Tailwind CSS and React CSS-in-JS (cannot be nonce-protected)
  #   Tailwind and component libraries inject runtime styles that cannot use nonces
  # connect-src: Pinned to specific Render subdomains (tightened from *.onrender.com).
  # In production, all service calls route through /bff/* (same-origin) via Netlify redirects/edge functions.
  # These explicit entries cover local dev overrides (VITE_CEE_DRAFT_BASE).
  # isl-staging removed (login 3.4 item 4): the browser has no legitimate
  # direct ISL path — all ISL traffic is same-origin /bff/isl via the edge
  # proxy (adapters/isl/client.ts), which browser CSP does not govern.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plot-lite-service-staging.onrender.com https://olumi-assistants-service.onrender.com https://cee-staging.onrender.com https://*.supabase.co https://api.openai.com wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
  # Prevent clickjacking
  X-Frame-Options = "DENY"
  # Prevent MIME sniffing
  X-Content-Type-Options = "nosniff"
  # Control referrer information
  Referrer-Policy = "strict-origin-when-cross-origin"
  # Restrict browser features
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
  cache-control = "no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/bff/engine/*"
  to = "https://plot-lite-service-staging.onrender.com/:splat"
  status = 200
  force = true

# CEE (Assistants) Service - graph-readiness endpoint
# Routes /bff/cee/* → https://olumi-assistants-service.onrender.com/assist/v1/*
# Required for Results Panel confidence tier display
[[redirects]]
  from = "/bff/cee/*"
  to = "https://olumi-assistants-service.onrender.com/assist/v1/:splat"
  status = 200
  force = true
  headers = {X-Olumi-Assist-Key = "${ASSIST_API_KEY}"}

# CEE fallback route for /v1/cee/* path pattern
# Handles requests when VITE_CEE_BFF_BASE points to /v1/cee instead of /bff/cee
[[redirects]]
  from = "/v1/cee/*"
  to = "https://olumi-assistants-service.onrender.com/assist/v1/:splat"
  status = 200
  force = true
  headers = {X-Olumi-Assist-Key = "${ASSIST_API_KEY}"}

# =============================================================================
# Edge Functions (security-critical functions listed first for audit clarity)
# =============================================================================

# CSP Nonce Injection - MUST run before other edge functions on HTML responses
# Generates per-request cryptographic nonces for inline scripts
# Replaces 'unsafe-inline' with nonce-based CSP for security hardening
[[edge_functions]]
  function = "csp-nonce"
  path = "/*"

# ISL Service proxy - handled by Edge Function for auth header injection
# Requires ISL_API_KEY env var in Netlify dashboard
[[edge_functions]]
  function = "isl-proxy"
  path = "/bff/isl/*"

# Orchestrator proxy - handles CORS for CEE orchestrator endpoint
# CEE backend lacks CORS middleware on /orchestrate/* routes
[[edge_functions]]
  function = "orchestrator-proxy"
  path = "/bff/orchestrate/*"
