# =============================================================================
# Security Headers (P0 - Enterprise Compliance)
# =============================================================================

[[headers]]
  for = "/*"
  [headers.values]
  # CSP: Content Security Policy
  # script-src 'unsafe-inline': Required as base, replaced with nonce by csp-nonce edge function
  #   The edge function injects cryptographic nonces into inline scripts and updates CSP header
  # style-src 'unsafe-inline': Required for Tailwind CSS and React CSS-in-JS (cannot be nonce-protected)
  #   Tailwind and component libraries inject runtime styles that cannot use nonces
  # connect-src: Pinned to specific Render subdomains (tightened from *.onrender.com).
  # In production, all service calls route through /bff/* (same-origin) via Netlify redirects/edge functions.
  # These explicit entries cover local dev overrides (VITE_CEE_DRAFT_BASE).
  # isl-staging removed (login 3.4 item 4): the browser has no legitimate
  # direct ISL path — all ISL traffic is same-origin /bff/isl via the edge
  # proxy (adapters/isl/client.ts), which browser CSP does not govern.
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plot-lite-service-staging.onrender.com https://olumi-assistants-service.onrender.com https://cee-staging.onrender.com https://*.supabase.co https://api.openai.com wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
  # Prevent clickjacking
  X-Frame-Options = "DENY"
  # Prevent MIME sniffing
  X-Content-Type-Options = "nosniff"
  # Control referrer information
  Referrer-Policy = "strict-origin-when-cross-origin"
  # Restrict browser features
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/index.html"
  [headers.values]
  cache-control = "no-cache, must-revalidate, max-age=0"

# ⭐⭐ /version.json IS THE DEPLOYMENT-EVIDENCE ENDPOINT — IT MUST NEVER BE SERVED FROM CACHE.
#
# Measured 17 Aug 2026 (ROADMAP 2.1281). With NO rule here, this file inherited
# Netlify's platform default `public,max-age=0,must-revalidate`, and the edge stored
# it as a HIT with `ttl=31535922` (~365 days), serving `age` up to 18,827 s (5.2 h).
# Twenty consecutive deploy polls read the PREVIOUS commit; UNIFORMITY was the only
# tell. The discriminator was a same-site contrast: `/index.html` (no-cache, the rule
# directly above) revalidated at `age: 34` while `/version.json` sat at `age: 18465`.
#
# Failure direction is conservative (it can only report an OLDER sha, never falsely
# confirm a new deploy), so no past deploy claim was falsely confirmed by it — but it
# made a genuine deploy-TRIGGER outage (row 2.1280, which happened on CEE the same
# morning) INDISTINGUISHABLE from cache staleness. That combination is the hazard.
#
# ⭐⭐ CORRECTED 17 Aug 2026 — `Cache-Control` ALONE DOES NOT GOVERN THIS EDGE, AND THE
# ORIGINAL VERSION OF THIS RULE WOULD NOT HAVE FIXED ANYTHING. Three claims previously
# written here are REFUTED by measurement; they are removed rather than softened,
# because a plausible wrong mechanism in this file is what cost the 5.2-hour window.
#
#   REFUTED: "`public` is what defeats `must-revalidate` at this edge." Measured the
#   same minute: `/index.html` carries NO `public` (`no-cache,must-revalidate,max-age=0`
#   — the rule directly above) and is STILL a stored hit with ttl ~1 year.
#   REFUTED: "`no-cache, must-revalidate, max-age=0` is the shape PROVEN to revalidate
#   at THIS site." It is not: /index.html ships exactly that shape and is stored.
#   REFUTED: the `age: 34` vs `age: 18465` contrast. That was ENTRY AGE, not directive
#   behaviour — /index.html plain-GETs at age ~9,000 s too. A capture proves only what
#   it was pointed at.
#
# WHAT ACTUALLY GOVERNS (Netlify's documented precedence):
#   Netlify-CDN-Cache-Control  >  CDN-Cache-Control  >  Cache-Control
# Static assets default to `Netlify-CDN-Cache-Control: public, s-maxage=31536000,
# must-revalidate`, and Netlify explicitly IGNORES attempts to shorten that with a
# plain `Cache-Control`. Arithmetic proof, measured across three paths in one run:
# `ttl + age` = 31,536,001 / 31,536,000 / 31,536,000 for /version.json, /index.html
# and /assets/*.js alike — one directive governs all three, and it is not the one any
# of them sets. Hence the CDN-level header below: it is the only line here that
# actually stops the edge storing this file. `cache-control` is retained for browsers
# and intermediaries.
#
# ⚠⚠ AND THE ENDPOINT IS NODE-DEPENDENT — SO A SINGLE SAMPLE CANNOT ESTABLISH
# FRESHNESS. Two reads seconds apart, same URL, both real: `age: 0; fwd=miss; stored`
# then `age: 10100; hit; ttl=31525901`. Different edge nodes hold different entries.
# Consequence: the old criterion here (`require: age: 0 AND fwd=miss`) was NOT
# DISCRIMINATING — it passes on a cold node while the fix is inert (false pass) and
# fails on a warm node while the fix works (false fail). It was measured PASSING on
# the UNFIXED endpoint. Likewise ROADMAP 2.1281's "cache-immune read" recipe is INERT:
# request-side `If-None-Match`/`Pragma`/`Cache-Control: no-store` and query-string
# busting are all no-ops at this edge (same ETag, age keeps climbing). Its original
# `fwd=miss; age: 0` was the first request after a deploy invalidated the entry — the
# recipe took credit for the deploy's work.
#
# ⚠ VERIFY AFTER ANY CHANGE HERE — four conditions, and the CONTRAST is what makes it
# evidence rather than a coin toss:
#   git ls-remote https://github.com/Talchain/DecisionGuideAI staging   # derive the SHA independently
#   curl -sS -D- -o /tmp/vj.json https://staging--olumi.netlify.app/version.json \
#     | grep -iE '^HTTP|cache-control|^age:|cache-status|content-type'; cat /tmp/vj.json
#   curl -sS -D- -o /dev/null https://staging--olumi.netlify.app/index.html \
#     | grep -iE 'cache-control|^age:|cache-status'                     # contrast control, SAME run
#   FIXED requires ALL of: (1) `cache-control` has TURNED OVER to the new string — a
#   stored entry replays the old one, so the new string proves you are not on a stale
#   entry; (2) `cache-status` shows fwd=bypass or fwd=miss AND NO `ttl=` that sums with
#   `age` to ~31,536,000; (3) body `commit` equals the step-1 SHA, `content-type:
#   application/json`, 40-hex (a MISSING file returns index.html as HTTP 200 text/html
#   via the SPA catch-all, so assert the content-type); (4) the /index.html control in
#   the same run STILL reads a ~1-year stored hit — proving your reading is a property
#   of the new directive and not of a cold node.
#   A bare `age: 0` proves NOTHING on its own. Never record a deploy verdict from it.
[[headers]]
  for = "/version.json"
  [headers.values]
  netlify-cdn-cache-control = "no-store"
  cdn-cache-control = "no-store"
  cache-control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
  cache-control = "public, max-age=31536000, immutable"

# PLoT (engine) Service — the credential boundary.
#
# There is deliberately NO [[redirects]] rule for /bff/engine/* here, and none in
# public/_redirects either. Until the bundle-credential fix, BOTH files declared the
# same `/bff/engine/*` → plot-lite-service-staging rewrite — the exact duplicate-
# declaration shape the CEE note below warns about, with the netlify.toml copy dead
# on arrival (outranked by the _redirects catch-all) and the _redirects copy live.
#
# Neither could inject a request header, so PLoT's auth flip was survived by shipping
# the bearer to the BROWSER (VITE_PLOT_BEARER). Vite inlined it as a bare string
# literal into a public asset, where any visitor could read it. The seam is now the
# `plot-proxy` edge function (registered below), which injects PLOT_AUTH_TOKEN
# server-side. Do not re-add a redirect rule for this path in either file.

# CEE (Assistants) Service — ROADMAP 2.317.
#
# There is deliberately NO [[redirects]] rule for /bff/cee/* here. Two used to
# live at this spot (/bff/cee/* and a /v1/cee/* "fallback"), both pointing at
# olumi-assistants-service.onrender.com with a header-injection block. BOTH WERE
# UNREACHABLE ON EVERY DEPLOY: Netlify processes public/_redirects before
# netlify.toml redirects, and public/_redirects ends in the SPA catch-all
# `/*  /index.html  200`, so /bff/cee/health returned HTTP 200 text/html — the
# SPA index — instead of reaching CEE. They also named a host running a
# different, older build than CEE staging, so they were wrong twice over.
#
# The seam is now served by the `cee-proxy` edge function (registered below),
# which outranks the _redirects catch-all and can inject the auth header that a
# redirect rule cannot inject without putting the key somewhere the browser can
# read. Do not re-add a redirect rule here: it would be dead on arrival, and a
# second declaration of the same path in a second config file is exactly how
# this defect was born. See tests/ci-guards/netlify-bff-route-precedence.spec.ts,
# which fails if any /bff/* proxy path is declared only in a place the catch-all
# outranks.

# =============================================================================
# Edge Functions (security-critical functions listed first for audit clarity)
# =============================================================================

# CSP Nonce Injection - MUST run before other edge functions on HTML responses
# Generates per-request cryptographic nonces for inline scripts
# Replaces 'unsafe-inline' with nonce-based CSP for security hardening
[[edge_functions]]
  function = "csp-nonce"
  path = "/*"

# ISL Service proxy - handled by Edge Function for auth header injection
# Requires ISL_API_KEY env var in Netlify dashboard
[[edge_functions]]
  function = "isl-proxy"
  path = "/bff/isl/*"

# PLoT (engine) proxy - injects the PLoT bearer server-side so the browser holds no
# credential. Requires PLOT_AUTH_TOKEN in the Netlify dashboard (NOT VITE_-prefixed,
# NOT in any file here). Until it is set this proxy forwards unauthenticated and
# auth-gated PLoT routes answer 401 — inert, never a fabricated credential.
# Replaces the former /bff/engine/* rewrite, which could not inject a header and so
# forced the bearer into the client bundle.
[[edge_functions]]
  function = "plot-proxy"
  path = "/bff/engine/*"

# Legacy engine path (VITE_EDGE_GATEWAY_URL=/engine). Same target, same injection —
# bound here so it cannot become an unauthenticated back door around the boundary.
[[edge_functions]]
  function = "plot-proxy"
  path = "/engine/*"

# Orchestrator proxy - handles CORS for CEE orchestrator endpoint
# CEE backend lacks CORS middleware on /orchestrate/* routes
[[edge_functions]]
  function = "orchestrator-proxy"
  path = "/bff/orchestrate/*"

# CEE (Assistants) proxy - handles auth header injection for /bff/cee/*
# Requires ASSIST_API_KEY env var in Netlify dashboard (already provisioned;
# the same var orchestrator-proxy reads). An edge function rather than a
# redirect because _redirects cannot inject request headers and a netlify.toml
# redirect is outranked by the _redirects SPA catch-all — see ROADMAP 2.317.
[[edge_functions]]
  function = "cee-proxy"
  path = "/bff/cee/*"

# COLLAB (blind elicitation panels) proxy — /bff/collab/* → CEE /collab/v1/*.
# A FOURTH seam, not a reuse of /bff/cee/*: that one rewrites to /assist/v1/*,
# so the collab routes had no browser-reachable path at all. This function is
# also the only one whose forward allowlist carries x-collab-participant-token —
# without it a participant request reaches CEE token-less and 401s every time.
[[edge_functions]]
  function = "collab-proxy"
  path = "/bff/collab/*"
