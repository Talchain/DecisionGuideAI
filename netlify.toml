[build]
  command = "npm run build:ci && node scripts/assert-entry.cjs && echo '{\"commit\":\"'$(git rev-parse HEAD)'\",\"short\":\"'$(git rev-parse --short HEAD)'\",\"branch\":\"'$(git rev-parse --abbrev-ref HEAD)'\",\"timestamp\":\"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'\"}' > dist/version.json"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_PLC_LAB = "1"
  VITE_POC_ONLY = "0"
  VITE_COPILOT_ENABLED = "true"
  VITE_FEATURE_PLOT_USES_PLC_CANVAS = "1"
  VITE_AUTH_MODE = "guest"
  VITE_EDGE_GATEWAY_URL = "/engine"
  VITE_DISABLE_OPENAI = "1"
  VITE_FORCE_ENGINE = "1"
  VITE_FEATURE_SSE = "1"
  VITE_FEATURE_SCENARIO_SANDBOX = "1"
  VITE_FEATURE_SANDBOX_DECISION_CTA = "1"
  VITE_FEATURE_SANDBOX_MAPPING = "1"
  VITE_FEATURE_SANDBOX_PROJECTIONS = "1"
  VITE_FEATURE_SANDBOX_REALTIME = "1"
  VITE_FEATURE_SANDBOX_STRATEGY_BRIDGE = "1"
  VITE_FEATURE_SANDBOX_TRIGGERS_BASIC = "1"
  VITE_FEATURE_SANDBOX_VOTING = "1"
  VITE_FEATURE_WHITEBOARD = "1"
  SECRETS_SCAN_ENABLED = "false"
  # Brief E Task 4: New capability feature flags for staging QA
  VITE_FEATURE_GOAL_PROBABILITIES = "1"
  VITE_FEATURE_ISL_SYNTHESIS = "1"
  # Phase 1B: PLoT Enrichment Routing
  # When "1": UI reads robustness/validation from PLoT enrichment (eliminates ISL dual-pipeline)
  # When "0": UI calls ISL directly (legacy behavior)
  # Enable via Netlify dashboard for staged rollout, monitor error rates via PostHog/Sentry
  VITE_USE_PLOT_ENRICHMENT = "1"
  # Orchestrator V2 — AI conversation pipeline
  VITE_ENABLE_ORCHESTRATOR_V2 = "true"

# =============================================================================
# Staging-only env overrides
# Netlify's deploy-context syntax scopes env vars to a specific branch's
# builds. `[context.staging.environment]` applies only to builds for the
# `staging` branch (which Netlify deploys to `staging--olumi.netlify.app`).
# The production context (main) inherits ONLY from `[build.environment]`
# above, so flags listed here stay off in production until explicitly
# promoted.
# =============================================================================
[context.staging.environment]
  # Supabase publishable (anon-class) key — PUBLIC BY DESIGN (Supabase: "can be
  # safely shared publicly"). Set here 4 Aug 2026 after the project's key family
  # was revoked (Supabase secret-scanning enforcement; ROADMAP 2.471): the
  # dashboard-set VITE_SUPABASE_ANON_KEY went stale, and this file is the
  # config-as-source-of-truth surface for staging builds (Codex B4 precedent).
  # The SECRET key never goes in any repo file.
  VITE_SUPABASE_ANON_KEY = "sb_publishable_Bhx6ZBWU7aLGmTfEedg60g_O5P1SQ-T"
  # aiPanelV2 — floating-first Olumi UX (PR #148 + PR #149).
  # Enabled on staging for manual testing. Promote to production by
  # adding to `[build.environment]` ONLY after sign-off.
  VITE_FEATURE_AI_PANEL_V2 = "true"

  # Debug panel + payload-trace-store env gate (PR #156 follow-up).
  # `VITE_APP_ENV=staging` makes:
  #   1. `<DebugPanel />` (mounted in AppPoC) eligible when the user
  #      adds `?diag` / `?diag=1` to the URL OR sets
  #      `window.__OLUMI_DEBUG = true` in the console. `<DebugPanel />`
  #      refuses to render unless `VITE_APP_ENV ∈ {staging, development}`
  #      — see `src/components/DebugPanel.tsx :: shouldShowDebugPanel`.
  #   2. The payload-trace-store env gate (PR #152, PR #156) report
  #      `payload_inspection_status.enabled === true` with reason
  #      `app_env_staging_enabled` — see
  #      `src/lib/payload-trace-store.ts :: determinePayloadInspectionStatus`.
  # Production (main) does NOT inherit this; the trace-store gate stays
  # closed by default and the debug panel refuses to render.
  VITE_APP_ENV = "staging"

  # (retired) VITE_FEATURE_ANALYSIS_HERO_PANEL — the analysis-hero fork is
  # closed: AnalysisHeroContainer now mounts unconditionally in ResultsBody,
  # so the gate has no readers and the env key is no longer declared.
  # See PX-C analysis-cockpit consolidation.

  # Analysis-tab rebuild Wave 1 (Decision overview + Actions menu). Paul
  # enabled this via the Netlify UI on 2026-07-12 and accepted the surface
  # live; recorded here so the repo config matches deployed reality (Codex
  # B4: config-as-source-of-truth). Promote to production by adding to
  # [build.environment] ONLY after sign-off.
  VITE_FEATURE_DECISION_OVERVIEW = "1"

  # Analysis-tab rebuild Wave 3 (Strengthen your model — adaptive coaching
  # recommendations). The parity audit found the surface fully merged but
  # DARK on staging because this promotion was missed at merge time. Promote
  # to production by adding to [build.environment] ONLY after sign-off.
  VITE_FEATURE_STRENGTHEN_PANEL = "1"

  # Front door (real sign-in) — keep the REAL Supabase SDK in the staging
  # bundle. Without this, vite.config.ts aliases @supabase/supabase-js to
  # src/stubs/supabase-stub.mjs on every guest build, and that stub implements
  # NO sign-in method at all — signInWithOtp, signInWithOAuth and
  # signInWithPassword are all absent — so sign-in cannot work no matter what
  # the requireLogin flag says (the runbook in src/flags.ts `requireLogin`
  # documents exactly this trap).
  #
  # ⚠ This sentence was FALSE for the password route until #667 round 2: the
  # stub did carry `signInWithPassword` and answered `{ error: null }`, i.e.
  # production would have reported a successful sign-in it never performed.
  # Fixed in the stub, and pinned by AuthContext.optionalAuth.spec.tsx.
  #
  # This does NOT turn guest mode off: VITE_AUTH_MODE stays "guest", so
  # unauthenticated visitors still land on the guest canvas exactly as today
  # and the other workstreams' staging QA is unaffected. It only makes real
  # sign-in POSSIBLE for anyone who opts in per-browser with
  # `localStorage.setItem('feature.requireLogin', '1')`.
  #
  # Staging-scoped deliberately — production (main) inherits only from
  # [build.environment] and keeps the stub. Promote to [build.environment]
  # ONLY after sign-off.
  VITE_STUB_SUPABASE = "0"

  # Hero fixture gallery — internal-only /dev/hero-gallery route rendering
