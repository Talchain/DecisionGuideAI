  # banner on every instance). Staging-only for design review; never add to
  # `[build.environment]`. See src/flags.ts `heroFixtureGallery`.
  VITE_FEATURE_HERO_FIXTURE_GALLERY = "1"

  # ---------------------------------------------------------------------------
