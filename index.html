<!doctype html>
<!-- POC: The SPA will call window.__APP_MOUNTED__() ASAP; if it doesn't within ~2000ms (and CPU is quiet), we show the HTML safe screen. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Substituted at BUILD time by scripts/build-id.mjs (wired as a Vite plugin
      in vite.config.ts), never at runtime. After substitution the content is
      either the 40-char commit SHA — the same string dist/version.json carries
      as `commit` — or the literal word `unidentified`. It is never the
      unsubstituted placeholder below; scripts/ci/assert-build-id-stamped.mjs
      fails the build if one ever survives into dist/.

      (Deliberately no placeholder token in this comment: the stamp is a global
      literal replacement over the whole document, so a token written here would
      be substituted too and this sentence would go false.)

      This is the estate's only TAB-BOUND build marker. `/version.json` is
      fetched over the network and so describes the SERVER; this is read from the
      DOM of the document the tab actually loaded, with no request involved:

          document.querySelector('meta[name="x-build-id"]').content
    -->
    <meta name="x-build-id" content="%BUILD_ID%" />
    <title>Olumi</title>
    
    <style>
      /* Safe screen visible by default, hidden when React mounts */
      #poc-safe { 
        display: flex;
        opacity: 1;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: opacity 150ms ease-out;
      }
      #poc-safe[data-hidden="true"] { 
        display: none;
        opacity: 0;
      }
      /* Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        #poc-safe { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- POC: HTML-level Safe Screen (zero-dependency, can't fail to parse) -->
    <div id="poc-safe" style="position:fixed;inset:0;background:#0b1e11;color:#d7ffe0;font-family:system-ui,Arial,sans-serif;z-index:99999;padding:16px;overflow:auto">
      <div style="background:#12b886;color:#052a1f;padding:8px 12px;border-radius:8px;display:inline-block;font-weight:600">
        PoC HTML Safe Screen
      </div>
      <div style="margin-top:12px;font-size:14px">
        <div>build: <span id="poc-build"></span></div>
        <div>edge: <span id="poc-edge"></span></div>
      </div>
      <pre id="poc-health" style="margin-top:12px;background:#062016;color:#abffcd;padding:12px;border-radius:8px;white-space:pre-wrap"></pre>
    </div>

    <script>
      // POC: Minimal inline script for build/edge display
      (function () {
        // A build id is a commit SHA or nothing. This used to fall back to
        // `new Date().toISOString()`, which answered "which build is this?"
        // with the clock at page load — a plausible-looking value with no
        // relationship to the build. Combined with the placeholder never being
        // substituted, the safe screen showed users either the raw placeholder
        // token or a fabricated timestamp, and both read as an answer.
        // (No placeholder token written here on purpose — the build-time stamp
        // is a global literal replacement and would substitute it, turning this
        // comment false.)
        //
        // Validated POSITIVELY (must look like a SHA) rather than by excluding
        // known-bad strings: that covers the unsubstituted placeholder, the
        // empty string, a stray timestamp, and any future placeholder syntax,
        // without this script having to carry a copy of the placeholder token
        // — which the build-time stamp would itself substitute.
        var rawBuild = (document.querySelector('meta[name="x-build-id"]')?.content || '').trim().toLowerCase();
        var build = /^[0-9a-f]{7,40}$/.test(rawBuild) ? rawBuild : 'unidentified';
        var edge = '/engine';
        var buildEl = document.getElementById('poc-build');
        var edgeEl = document.getElementById('poc-edge');
        var safeEl = document.getElementById('poc-safe');
        
        buildEl && (buildEl.textContent = build);
        edgeEl && (edgeEl.textContent = edge);
        
        // Add data-testid for E2E tests
        if (safeEl) safeEl.setAttribute('data-testid', 'safe-screen');
        
        // Health check. This inline script runs during parse, so the safe
        // screen is still on screen here; `healthEl` is static markup and is
        // always present.
        //
        // NO FALLBACK PROBE. There used to be a `/bff/engine/health` retry in
        // the .catch(). It was a provable duplicate: public/_redirects sends
        // BOTH `/engine/*` (line 7) and `/bff/engine/*` (line 4) to the same
        // host, and netlify.toml's only engine rule (line 154) sends
        // `/bff/engine/*` there too — so the retry re-issued the byte-identical
        // request that had just failed, costing a second round-trip (worst
        // case, a second Render cold-start wait) on every page load, for a
        // <pre> the app hides milliseconds later. Any per-environment redirect
        // swap applies to both prefixes equally, so they cannot diverge.
        // (The pre-#395 fallback was a hardcoded cross-origin host — CSP-blocked,
        // so it was rejected at zero network cost. Making it same-origin made it
        // real. Deleted 2026-07-20.)
        var healthEl = document.getElementById('poc-health');
        if (healthEl) {
          fetch(edge + '/health').then(function(r){ return r.json(); }).then(function(d){
            healthEl.textContent = 'OK via proxy\n' + JSON.stringify(d, null, 2);
          }).catch(function(e){
            healthEl.textContent = 'FAIL\n' + String(e);
          });
        }
      })();
    </script>

    <!-- PRE-REACT SAFE HIDE + BOOT TELEMETRY -->
    <script>
    (function () {
      window.__SAFE_DEBUG__ = window.__SAFE_DEBUG__ || { logs: [] };
      const log = (m, extra) => { __SAFE_DEBUG__.logs.push({ t: Date.now(), m, extra }); console.log('[BOOT]', m, extra ?? ''); };

      // define & immediately call the safe-screen hide so overlay never blocks React
      window.__APP_MOUNTED__ = function(reason = 'app-mounted-callback') {
        log('__APP_MOUNTED__()', { reason });
        const safe = document.getElementById('poc-safe');
        if (safe) { safe.setAttribute('data-hidden', 'true'); safe.style.display = 'none'; }
        window.__APP_MOUNTED_FLAG__ = true;
      };
      window.__APP_MOUNTED__('pre-react');
    })();
    </script>

    <!-- THE ONLY module script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
