<!doctype html>
<!-- The view gallery's own page (src/olumiView/gallery/boot.ts). It is an input of the gallery build only (vite.gallery.config.ts): the
     product build starts from index.html and never reaches this page or the saved Views it draws. No inline script, by design: nothing
     may ask for anything before the gallery's isolation is in place. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-build-id" content="%BUILD_ID%" />
    <!-- Enforced by the browser, whatever the app's code does (Codex 14 Nov: a build-time monitoring id would add a remote script that no
         fetch replacement sees). Scripts, connections, frames and workers: this origin only. The one outside host allowed is the font
         stylesheet every page of the app asks for, and its font files. A refusal is listed by the isolation (./isolate.ts). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" />
    <title>Olumi: saved Views</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/olumiView/gallery/boot.ts"></script>
  </body>
</html>
